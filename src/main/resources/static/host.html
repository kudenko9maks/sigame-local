<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>SiGame Local — Ведущий</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #050b3d;
            color: white;
        }

        body {
            overflow: hidden;
        }


        /* =========================
           LOBBY
           ========================= */

        #hostSetup {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 20px;
        }


        #hostSetup input {

            width: 300px;

            padding: 15px;

            font-size: 20px;
        }


        #hostSetup button {

            width: 300px;

            padding: 15px;

            font-size: 20px;

            cursor: pointer;
        }


        /* =========================
           GAME
           ========================= */

        #gameScreen {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;
        }


        .game-header {

            height: 70px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 32px;

            font-weight: bold;

            background: #070d52;

            border-bottom: 2px solid #6972c7;
        }


        /* =========================
           BOARD
           ========================= */

        #board {

            flex: 1;

            display: grid;

            gap: 2px;

            padding: 10px;

            overflow: auto;
        }


        .category {

            display: flex;

            flex-direction: column;

            min-width: 0;
        }


        .category-name {

            min-height: 70px;

            display: flex;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 10px;

            font-size: 24px;

            font-weight: bold;

            background: #080f66;

            border: 1px solid #9aa2ff;
        }


        .question-cell {

            flex: 1;

            min-height: 70px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 32px;

            font-weight: bold;

            color: #f5f5ff;

            background: #070d58;

            border: 1px solid #737bd3;

            cursor: pointer;

            transition:
                    background 0.15s,
                    transform 0.1s;
        }


        .question-cell:hover {

            background: #111a82;

            transform: scale(1.01);
        }


        .question-cell.used {

            color: transparent;

            background: #03072d;

            cursor: default;
        }


        .question-cell.used:hover {

            transform: none;
        }


        /* =========================
           TURN
           ========================= */

        #turnInfo {

            min-height: 70px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 26px;

            font-weight: bold;

            background: #070d52;

            border-top: 2px solid #6972c7;
        }


        /* =========================
           PLAYERS
           ========================= */

        #players {

            min-height: 100px;

            display: flex;

            justify-content: center;

            gap: 8px;

            padding: 8px;

            background: #03062b;
        }


        .player-card {

            min-width: 150px;

            padding: 8px 15px;

            text-align: center;

            border: 1px solid #4e58bd;

            background: #080f52;
        }


        .player-card.active {

            border: 3px solid white;
        }


        .player-name {

            font-size: 18px;
        }


        .player-score {

            margin-top: 5px;

            font-size: 24px;

            font-weight: bold;
        }


        /* =========================
           QUESTION
           ========================= */

        #questionScreen {

            position: fixed;

            inset: 0;

            z-index: 100;

            display: none;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 40px;

            background: #050b3d;
        }


        #questionPrice {

            font-size: 30px;

            margin-bottom: 25px;
        }


        #questionText {

            max-width: 1000px;

            font-size: 48px;

            line-height: 1.2;
        }


        /* =========================
           ANSWER
           ========================= */

        #answerBox {

            margin-top: 25px;

            padding: 15px 25px;

            background: #e8f5e9;

            color: #1b5e20;

            border-radius: 10px;

            font-size: 24px;
        }


        #answerText {

            font-weight: bold;
        }


        /* =========================
           STATUS
           ========================= */

        #answeringStatus {

            margin-top: 25px;

            font-size: 30px;

            font-weight: bold;
        }


        /* =========================
           CONTROLS
           ========================= */

        #questionControls {

            margin-top: 30px;
        }


        #questionControls button {

            padding: 15px 30px;

            margin: 5px;

            font-size: 20px;

            cursor: pointer;
        }


        .hidden {

            display: none !important;
        }

    </style>

</head>


<body>


<!-- =========================
     HOST SETUP
     ========================= -->

<div id="hostSetup">

    <h1>SiGame Local</h1>

    <p>Вы ведущий</p>

    <input
            id="hostName"
            type="text"
            placeholder="Имя ведущего"
            maxlength="20"
    >

    <button onclick="becomeHost()">
        Стать ведущим
    </button>

    <p id="error"></p>

</div>


<!-- =========================
     GAME
     ========================= -->

<div id="gameScreen" class="hidden">

    <div class="game-header">

        SiGame

    </div>


    <div id="board">
    </div>


    <div id="turnInfo">
        Игра ещё не началась
    </div>


    <div id="players">
    </div>

</div>


<!-- =========================
     QUESTION
     ========================= -->

<div id="questionScreen">

    <div id="questionPrice"></div>

    <div id="questionText"></div>


    <div id="answerBox">

        <strong>
            Правильный ответ:
        </strong>

        <span id="answerText"></span>

    </div>


    <div id="answeringStatus"></div>


    <div id="questionControls">

        <button
                id="startAnsweringButton"
                onclick="startAnswering()"
        >
            Разрешить отвечать
        </button>


        <button
                onclick="answerCorrect()"
        >
            ✓ Правильно
        </button>


        <button
                onclick="answerIncorrect()"
        >
            ✗ Неправильно
        </button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>


<script>

    let currentGame = null;


    /* =========================
       SHOW GAME
       ========================= */

    function showGameScreen() {

        document
            .getElementById("hostSetup")
            .classList.add("hidden");


        document
            .getElementById("gameScreen")
            .classList.remove("hidden");
    }


    /* =========================
       BECOME HOST
       ========================= */

    async function becomeHost() {

        const name =
            document
                .getElementById("hostName")
                .value
                .trim();


        const error =
            document
                .getElementById("error");


        if (!name) {

            error.textContent =
                "Введите имя";

            return;
        }


        try {

            const response =
                await fetch(
                    `/api/host?name=${encodeURIComponent(name)}`,
                    {
                        method: "POST"
                    }
                );


            if (!response.ok) {

                error.textContent =
                    await response.text();

                return;
            }


            const host =
                await response.json();


            localStorage.setItem(
                "hostId",
                host.id
            );


            showGameScreen();

            loadGame();


        } catch (e) {

            console.error(e);

            error.textContent =
                "Ошибка подключения";
        }
    }


    /* =========================
       RESTORE HOST
       ========================= */

    async function restoreHost() {

        const hostId =
            localStorage.getItem(
                "hostId"
            );


        if (!hostId) {
            return;
        }


        try {

            const response =
                await fetch(
                    "/api/host",
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                localStorage.removeItem(
                    "hostId"
                );

                return;
            }


            const host =
                await response.json();


            if (
                !host ||
                host.id !== hostId
            ) {

                localStorage.removeItem(
                    "hostId"
                );

                return;
            }


            showGameScreen();

            loadGame();


        } catch (e) {

            console.error(
                "Failed to restore host:",
                e
            );
        }
    }


    /* =========================
       LOAD GAME
       ========================= */

    async function loadGame() {

        try {

            const response =
                await fetch(
                    "/api/game",
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {
                return;
            }


            const game =
                await response.json();


            updateGame(game);


        } catch (e) {

            console.error(
                "Failed to load game:",
                e
            );
        }
    }


    /* =========================
       UPDATE GAME
       ========================= */

    function updateGame(game) {

        currentGame = game;


        if (
            game.state === "LOBBY"
        ) {

            hideQuestion();

            renderLobby(game);

            return;
        }


        if (
            game.state === "BOARD"
        ) {

            hideQuestion();

            renderBoard(game);

            return;
        }


        if (
            game.state === "QUESTION" ||
            game.state === "ANSWERING"
        ) {

            renderBoard(game);

            showQuestion(game);

            return;
        }


        if (
            game.state === "FINISHED"
        ) {

            hideQuestion();

            renderBoard(game);
        }
    }


    /* =========================
       LOBBY
       ========================= */

    function renderLobby(game) {

        document
            .getElementById("turnInfo")
            .textContent =
            `Игроков подключено: ${(game.players || []).length}`;


        renderPlayers(game);
    }


    /* =========================
       BOARD
       ========================= */

    function renderBoard(game) {

        const board =
            document.getElementById(
                "board"
            );


        board.innerHTML = "";


        const categories =
            game.categories || [];


        if (
            categories.length === 0
        ) {

            return;
        }


        board.style.gridTemplateColumns =
            `repeat(${categories.length}, 1fr)`;


        categories.forEach(
            category => {

                const column =
                    document.createElement(
                        "div"
                    );


                column.className =
                    "category";


                const title =
                    document.createElement(
                        "div"
                    );


                title.className =
                    "category-name";


                title.textContent =
                    category.name;


                column.appendChild(
                    title
                );


                (
                    category.questions || []
                ).forEach(
                    question => {

                        const cell =
                            document.createElement(
                                "div"
                            );


                        cell.className =
                            "question-cell";


                        if (
                            question.used
                        ) {

                            cell.classList.add(
                                "used"
                            );

                        } else {

                            cell.textContent =
                                question.price;


                            cell.onclick =
                                () => {

                                    selectQuestion(
                                        category.name,
                                        question.price
                                    );
                                };
                        }


                        column.appendChild(
                            cell
                        );

                    }
                );


                board.appendChild(
                    column
                );
            }
        );


        renderTurn(game);

        renderPlayers(game);
    }


    /* =========================
       TURN
       ========================= */

    function renderTurn(game) {

        const turnInfo =
            document.getElementById(
                "turnInfo"
            );


        if (
            !game.turnPlayer
        ) {

            turnInfo.textContent =
                "Ход ещё не определён";

            return;
        }


        turnInfo.textContent =
            `Ходит: ${game.turnPlayer.name}`;
    }


    /* =========================
       PLAYERS
       ========================= */

    function renderPlayers(game) {

        const players =
            document.getElementById(
                "players"
            );


        players.innerHTML = "";


        (
            game.players || []
        ).forEach(
            player => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "player-card";


                if (
                    game.turnPlayer &&
                    game.turnPlayer.id ===
                    player.id
                ) {

                    card.classList.add(
                        "active"
                    );
                }


                card.innerHTML = `
                    <div class="player-name">
                        ${escapeHtml(player.name)}
                    </div>

                    <div class="player-score">
                        ${player.score}
                    </div>
                `;


                players.appendChild(
                    card
                );
            }
        );
    }


    /* =========================
       HTML ESCAPE
       ========================= */

    function escapeHtml(value) {

        return String(value)

            .replaceAll(
                "&",
                "&amp;"
            )

            .replaceAll(
                "<",
                "&lt;"
            )

            .replaceAll(
                ">",
                "&gt;"
            )

            .replaceAll(
                '"',
                "&quot;"
            )

            .replaceAll(
                "'",
                "&#039;"
            );
    }


    /* =========================
       SELECT QUESTION
       ========================= */

    async function selectQuestion(
        category,
        price
    ) {

        try {

            const response =
                await fetch(
                    `/api/game/question/select?category=${encodeURIComponent(category)}&price=${price}`,
                    {
                        method: "POST"
                    }
                );


            if (!response.ok) {

                console.error(
                    "Question selection failed:",
                    await response.text()
                );
            }


        } catch (error) {

            console.error(error);
        }
    }


    /* =========================
       SHOW QUESTION
       ========================= */

    function showQuestion(game) {

        const question =
            game.currentQuestion;


        if (!question) {
            return;
        }


        document
            .getElementById(
                "questionScreen"
            )
            .style.display =
            "flex";


        document
            .getElementById(
                "questionPrice"
            )
            .textContent =
            question.price;


        document
            .getElementById(
                "questionText"
            )
            .textContent =
            question.text;


        document
            .getElementById(
                "answerText"
            )
            .textContent =
            question.answer ?? "—";


        const status =
            document.getElementById(
                "answeringStatus"
            );


        const startButton =
            document.getElementById(
                "startAnsweringButton"
            );


        if (
            game.state === "QUESTION"
        ) {

            status.textContent =
                "Ведущий показывает вопрос";


            startButton.classList.remove(
                "hidden"
            );

        } else {

            startButton.classList.add(
                "hidden"
            );


            if (
                game.buzzedPlayer
            ) {

                status.textContent =
                    `${game.buzzedPlayer.name} отвечает`;

            } else {

                status.textContent =
                    "Игроки могут нажимать кнопку";
            }
        }
    }


    /* =========================
       HIDE QUESTION
       ========================= */

    function hideQuestion() {

        document
            .getElementById(
                "questionScreen"
            )
            .style.display =
            "none";
    }


    /* =========================
       START ANSWERING
       ========================= */

    async function startAnswering() {

        try {

            const response =
                await fetch(
                    "/api/game/answering",
                    {
                        method: "POST"
                    }
                );


            if (!response.ok) {

                console.error(
                    await response.text()
                );
            }


        } catch (error) {

            console.error(error);
        }
    }


    /* =========================
       CORRECT
       ========================= */

    async function answerCorrect() {

        try {

            const response =
                await fetch(
                    "/api/game/answer/correct",
                    {
                        method: "POST"
                    }
                );


            if (!response.ok) {

                console.error(
                    await response.text()
                );
            }


        } catch (error) {

            console.error(error);
        }
    }


    /* =========================
       INCORRECT
       ========================= */

    async function answerIncorrect() {

        try {

            const response =
                await fetch(
                    "/api/game/answer/incorrect",
                    {
                        method: "POST"
                    }
                );


            if (!response.ok) {

                console.error(
                    await response.text()
                );
            }


        } catch (error) {

            console.error(error);
        }
    }


    /* =========================
       WEBSOCKET
       ========================= */

    const socket =
        new StompJs.Client({

            brokerURL:
                `${
                    location.protocol === "https:"
                        ? "wss"
                        : "ws"
                }://${window.location.host}/ws`,


            reconnectDelay: 2000,


            heartbeatIncoming: 10000,


            heartbeatOutgoing: 10000,


            onConnect: () => {

                console.log(
                    "Host WebSocket connected"
                );


                socket.subscribe(
                    "/topic/host",
                    message => {

                        try {

                            const event =
                                JSON.parse(
                                    message.body
                                );


                            if (
                                event.game
                            ) {

                                updateGame(
                                    event.game
                                );
                            }


                        } catch (e) {

                            console.error(
                                "Host WS message error:",
                                e
                            );
                        }
                    }
                );


                loadGame();
            },


            onDisconnect: () => {

                console.log(
                    "Host WebSocket disconnected"
                );
            },


            onWebSocketClose: () => {

                console.log(
                    "Host WebSocket closed"
                );
            },


            onWebSocketError: error => {

                console.error(
                    "Host WebSocket error:",
                    error
                );
            },


            onStompError: frame => {

                console.error(
                    "Host STOMP error:",
                    frame
                );
            }

        });


    socket.activate();


    /*
     * Дополнительная синхронизация.
     *
     * В норме состояние приходит
     * через WebSocket мгновенно.
     *
     * Если WebSocket временно пропадёт,
     * REST автоматически восстановит состояние.
     */

    setInterval(
        loadGame,
        1000
    );


    /* =========================
       START
       ========================= */

    restoreHost();

</script>

</body>

</html>
