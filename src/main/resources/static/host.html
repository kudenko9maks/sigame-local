<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SiGame Local — Ведущий</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #050b3d;
            color: white;
        }

        body {
            overflow: hidden;
        }

        .hidden {
            display: none !important;
        }

        #hostSetup {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        #hostSetup input {
            width: 300px;
            padding: 15px;
            font-size: 20px;
        }

        #hostSetup button {
            width: 300px;
            padding: 15px;
            font-size: 20px;
            cursor: pointer;
        }

        #gameScreen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .game-header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            background: #070d52;
            border-bottom: 2px solid #6972c7;
        }

        #packPanel {
            min-height: 90px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            background: #080f52;
            border-bottom: 1px solid #4e58bd;
        }

        #packInfo {
            min-width: 300px;
            padding: 10px 15px;
            text-align: center;
            background: #050b3d;
            border-radius: 6px;
            font-size: 16px;
        }

        #packFile {
            max-width: 300px;
            padding: 8px;
            font-size: 15px;
            color: white;
        }

        #packPanel button {
            padding: 10px 18px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
        }

        #startGameButton {
            font-weight: bold;
        }

        #startGameButton:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #packError {
            width: 100%;
            margin: 0;
            text-align: center;
            color: #ff7777;
            font-size: 16px;
        }

        #board {
            flex: 1;
            display: grid;
            gap: 2px;
            padding: 10px;
            overflow: auto;
        }

        .category {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .category-name {
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            font-size: 24px;
            font-weight: bold;
            background: #080f66;
            border: 1px solid #9aa2ff;
        }

        .question-cell {
            flex: 1;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #f5f5ff;
            background: #070d58;
            border: 1px solid #737bd3;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

        .question-cell:hover {
            background: #111a82;
            transform: scale(1.01);
        }

        .question-cell.used {
            color: transparent;
            background: #03072d;
            cursor: default;
        }

        .question-cell.used:hover {
            transform: none;
        }

        #turnInfo {
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            background: #070d52;
            border-top: 2px solid #6972c7;
        }

        #players {
            min-height: 100px;
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 8px;
            background: #03062b;
            overflow-x: auto;
        }

        .player-card {
            min-width: 150px;
            padding: 8px 15px;
            text-align: center;
            border: 1px solid #4e58bd;
            background: #080f52;
        }

        .player-card.active {
            border: 3px solid white;
        }

        .player-name {
            font-size: 18px;
        }

        .player-score {
            margin-top: 5px;
            font-size: 24px;
            font-weight: bold;
        }

        #questionScreen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
            background: #050b3d;
        }

        #questionPrice {
            font-size: 30px;
            margin-bottom: 25px;
        }

        #questionText {
            max-width: 1000px;
            font-size: 48px;
            line-height: 1.2;
        }

        #answerBox {
            margin-top: 25px;
            padding: 15px 25px;
            background: #e8f5e9;
            color: #1b5e20;
            border-radius: 10px;
            font-size: 24px;
        }

        #answerText {
            font-weight: bold;
        }

        #answeringStatus {
            margin-top: 25px;
            font-size: 30px;
            font-weight: bold;
        }

        #questionControls {
            margin-top: 30px;
        }

        #questionControls button {
            padding: 15px 30px;
            margin: 5px;
            font-size: 20px;
            cursor: pointer;
        }

        #presentationScreen {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #050b3d;
            color: white;
        }

        #presentationRound {
            position: absolute;
            top: 35px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 38px;
            font-weight: bold;
            opacity: 0.85;
            z-index: 5;
        }

        #presentationCategories {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            font-size: 58px;
            font-weight: bold;
            text-align: center;
        }

        .presentation-category {
            flex-shrink: 0;
            white-space: nowrap;
            text-shadow: 0 0 25px rgba(120, 130, 255, .6);
        }

        .initial-presentation {
            animation: initialPresentationMove 10s linear forwards;
        }

        @keyframes initialPresentationMove {

            from {
                transform: translateY(-100vh);
            }

            to {
                transform: translateY(100vh);
            }
        }

        .round-presentation {
            animation: roundCategoryAnimation 2s ease-in-out forwards;
        }

        @keyframes roundCategoryAnimation {

            0% {
                opacity: 0;
                transform: translateY(100px);
            }

            20% {
                opacity: 1;
                transform: translateY(0);
            }

            80% {
                opacity: 1;
                transform: translateY(0);
            }

            100% {
                opacity: 0;
                transform: translateY(-100px);
            }
        }

    </style>

</head>

<body>

<div id="hostSetup">

    <h1>SiGame Local</h1>

    <p>Вы ведущий</p>

    <input
            id="hostName"
            type="text"
            placeholder="Имя ведущего"
            maxlength="20"
    >

    <button onclick="becomeHost()">
        Стать ведущим
    </button>

    <p id="error"></p>

</div>


<div id="presentationScreen" class="hidden">

    <div id="presentationRound"></div>

    <div id="presentationCategories"></div>

</div>


<div id="gameScreen" class="hidden">

    <div class="game-header">
        SiGame
    </div>

    <div id="packPanel">

        <div id="packInfo">
            Пак не загружен
        </div>

        <input
                id="packFile"
                type="file"
                accept=".json,application/json"
        >

        <button
                id="uploadPackButton"
                onclick="uploadPack()"
        >
            Загрузить пак
        </button>

        <button
                id="startGameButton"
                onclick="startGame()"
                disabled
        >
            НАЧАТЬ ИГРУ
        </button>

        <p id="packError"></p>

    </div>

    <div id="board"></div>

    <div id="turnInfo">
        Игра ещё не началась
    </div>

    <div id="players"></div>

</div>


<div id="questionScreen">

    <div id="questionPrice"></div>

    <div id="questionText"></div>

    <div id="answerBox">

        <strong>
            Правильный ответ:
        </strong>

        <span id="answerText"></span>

    </div>

    <div id="answeringStatus"></div>

    <div id="questionControls">

        <button
                id="startAnsweringButton"
                onclick="startAnswering()"
        >
            Разрешить отвечать
        </button>

        <button onclick="answerCorrect()">
            ✓ Правильно
        </button>

        <button onclick="answerIncorrect()">
            ✗ Неправильно
        </button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

<script>

    let currentGame = null;
    let currentPack = null;

    let presentationTimer = null;

    let initialPresentationPlayed = false;
    let presentationRunning = false;


    function showGameScreen() {

        document
            .getElementById("hostSetup")
            .classList.add("hidden");

        document
            .getElementById("gameScreen")
            .classList.remove("hidden");
    }


    async function becomeHost() {

        const name =
            document
                .getElementById("hostName")
                .value
                .trim();

        const error =
            document.getElementById("error");

        if (!name) {

            error.textContent = "Введите имя";

            return;
        }

        try {

            const response =
                await fetch(
                    `/api/host?name=${encodeURIComponent(name)}`,
                    {
                        method: "POST"
                    }
                );

            if (!response.ok) {

                error.textContent =
                    await response.text();

                return;
            }

            const host =
                await response.json();

            localStorage.setItem(
                "hostId",
                host.id
            );

            showGameScreen();

            loadGame();

        } catch (e) {

            console.error(e);

            error.textContent =
                "Ошибка подключения";
        }
    }


    async function restoreHost() {

        const hostId =
            localStorage.getItem("hostId");

        if (!hostId) {
            return;
        }

        try {

            const response =
                await fetch(
                    "/api/host",
                    {
                        cache: "no-store"
                    }
                );

            if (!response.ok) {

                localStorage.removeItem(
                    "hostId"
                );

                return;
            }

            const host =
                await response.json();

            if (
                !host ||
                host.id !== hostId
            ) {

                localStorage.removeItem(
                    "hostId"
                );

                return;
            }

            showGameScreen();

            loadGame();

        } catch (e) {

            console.error(e);
        }
    }


    async function uploadPack() {

        const fileInput =
            document.getElementById("packFile");

        const error =
            document.getElementById("packError");

        const startButton =
            document.getElementById("startGameButton");

        error.textContent = "";

        if (!fileInput.files.length) {

            error.textContent =
                "Выберите JSON-файл";

            return;
        }

        const file =
            fileInput.files[0];

        if (
            !file.name
                .toLowerCase()
                .endsWith(".json")
        ) {

            error.textContent =
                "Можно загружать только JSON-файлы";

            return;
        }

        const formData =
            new FormData();

        formData.append(
            "file",
            file
        );

        try {

            const response =
                await fetch(
                    "/api/pack/upload",
                    {
                        method: "POST",
                        body: formData
                    }
                );

            if (!response.ok) {

                error.textContent =
                    await response.text();

                return;
            }

            const pack =
                await response.json();

            currentPack =
                pack;

            updatePackInfo(pack);

            startButton.disabled =
                false;

        } catch (e) {

            console.error(e);

            error.textContent =
                "Ошибка загрузки пака";
        }
    }


    function updatePackInfo(pack) {

        const packInfo =
            document.getElementById("packInfo");

        let categoryCount = 0;
        let questionCount = 0;

        (pack.rounds || []).forEach(
            round => {

                categoryCount +=
                    (round.categories || []).length;

                (round.categories || []).forEach(
                    category => {

                        questionCount +=
                            (category.questions || []).length;
                    }
                );
            }
        );

        packInfo.innerHTML = `
            <strong>${escapeHtml(pack.name)}</strong>
            <br><br>
            Раундов: ${pack.rounds.length}
            <br>
            Тем: ${categoryCount}
            <br>
            Вопросов: ${questionCount}
        `;
    }


    function startInitialPresentation(game) {

        if (initialPresentationPlayed) {
            return;
        }

        initialPresentationPlayed = true;
        presentationRunning = true;

        clearTimeout(presentationTimer);

        const screen =
            document.getElementById(
                "presentationScreen"
            );

        const container =
            document.getElementById(
                "presentationCategories"
            );

        const title =
            document.getElementById(
                "presentationRound"
            );

        container.innerHTML = "";
        container.className =
            "initial-presentation";

        title.textContent =
            "ИГРА НАЧИНАЕТСЯ";

        const categories = [];

        (game.pack?.rounds || []).forEach(
            round => {

                (round.categories || []).forEach(
                    category => {

                        categories.push(
                            category.name
                        );
                    }
                );
            }
        );

        categories.forEach(
            name => {

                const element =
                    document.createElement("div");

                element.className =
                    "presentation-category";

                element.textContent =
                    name;

                container.appendChild(
                    element
                );
            }
        );

        screen.classList.remove("hidden");

        document
            .getElementById("gameScreen")
            .classList.add("hidden");

        hideQuestion();

        presentationTimer =
            setTimeout(
                () => {
                    startFirstRoundPresentation(game);
                },
                10000
            );
    }


    function startFirstRoundPresentation(game) {

        clearTimeout(presentationTimer);

        const screen =
            document.getElementById(
                "presentationScreen"
            );

        const container =
            document.getElementById(
                "presentationCategories"
            );

        const title =
            document.getElementById(
                "presentationRound"
            );

        container.innerHTML = "";
        container.className = "";

        title.textContent =
            "РАУНД 1";

        screen.classList.remove("hidden");

        document
            .getElementById("gameScreen")
            .classList.add("hidden");

        const round =
            game.pack?.rounds?.[0];

        const categories =
            round?.categories || [];

        showRoundCategory(
            categories,
            0
        );
    }


    function showRoundCategory(
        categories,
        index
    ) {

        const container =
            document.getElementById(
                "presentationCategories"
            );

        if (
            index >= categories.length
        ) {

            finishPresentation();

            return;
        }

        container.innerHTML = "";
        container.className = "";

        const element =
            document.createElement("div");

        element.className =
            "presentation-category round-presentation";

        element.textContent =
            categories[index].name;

        container.appendChild(
            element
        );

        presentationTimer =
            setTimeout(
                () => {

                    showRoundCategory(
                        categories,
                        index + 1
                    );

                },
                2000
            );
    }


    function finishPresentation() {

        clearTimeout(presentationTimer);

        presentationRunning = false;

        document
            .getElementById(
                "presentationScreen"
            )
            .classList.add("hidden");

        document
            .getElementById(
                "gameScreen"
            )
            .classList.remove("hidden");

        loadGame();
    }


    async function startGame() {

        const error =
            document.getElementById(
                "packError"
            );

        if (!currentPack) {

            error.textContent =
                "Сначала загрузите игровой пак";

            return;
        }

        initialPresentationPlayed = false;
        presentationRunning = false;

        try {

            const response =
                await fetch(
                    "/api/game/start",
                    {
                        method: "POST"
                    }
                );

            if (!response.ok) {

                error.textContent =
                    await response.text();

                return;
            }

            const game =
                await response.json();

            updateGame(game);

        } catch (e) {

            console.error(e);

            error.textContent =
                "Не удалось начать игру";
        }
    }


    async function loadGame() {

        try {

            const response =
                await fetch(
                    "/api/game",
                    {
                        cache: "no-store"
                    }
                );

            if (!response.ok) {
                return;
            }

            const game =
                await response.json();

            updateGame(game);

        } catch (e) {

            console.error(e);
        }
    }


    function updateGame(game) {

        currentGame = game;

        if (
            !initialPresentationPlayed &&
            game.pack &&
            game.currentRound === 0 &&
            game.state === "BOARD"
        ) {

            startInitialPresentation(game);

            return;
        }

        if (presentationRunning) {
            return;
        }

        if (
            game.state === "PRESENTATION"
        ) {
            return;
        }

        hidePresentation();

        if (
            game.state === "LOBBY"
        ) {

            hideQuestion();

            renderLobby(game);

            return;
        }

        if (
            game.state === "BOARD"
        ) {

            hideQuestion();

            renderBoard(game);

            return;
        }

        if (
            game.state === "QUESTION" ||
            game.state === "ANSWERING"
        ) {

            renderBoard(game);

            showQuestion(game);

            return;
        }

        if (
            game.state === "FINISHED"
        ) {

            hideQuestion();

            renderBoard(game);
        }
    }


    function renderLobby(game) {

        document
            .getElementById("turnInfo")
            .textContent =
            `Игроков подключено: ${(game.players || []).length}`;

        renderPlayers(game);
    }


    function renderBoard(game) {

        const board =
            document.getElementById("board");

        board.innerHTML = "";

        const categories =
            game.categories || [];

        if (!categories.length) {
            return;
        }

        board.style.gridTemplateColumns =
            `repeat(${categories.length}, 1fr)`;

        categories.forEach(
            category => {

                const column =
                    document.createElement("div");

                column.className =
                    "category";

                const title =
                    document.createElement("div");

                title.className =
                    "category-name";

                title.textContent =
                    category.name;

                column.appendChild(title);

                (category.questions || []).forEach(
                    question => {

                        const cell =
                            document.createElement("div");

                        cell.className =
                            "question-cell";

                        if (question.used) {

                            cell.classList.add("used");

                        } else {

                            cell.textContent =
                                question.price;

                            cell.onclick =
                                () => {

                                    selectQuestion(
                                        category.name,
                                        question.price
                                    );
                                };
                        }

                        column.appendChild(cell);
                    }
                );

                board.appendChild(column);
            }
        );

        renderTurn(game);
        renderPlayers(game);
    }


    function renderTurn(game) {

        const turnInfo =
            document.getElementById("turnInfo");

        if (!game.turnPlayer) {

            turnInfo.textContent =
                "Ход ещё не определён";

            return;
        }

        turnInfo.textContent =
            `Ходит: ${game.turnPlayer.name}`;
    }


    function renderPlayers(game) {

        const players =
            document.getElementById("players");

        players.innerHTML = "";

        (game.players || []).forEach(
            player => {

                const card =
                    document.createElement("div");

                card.className =
                    "player-card";

                if (
                    game.turnPlayer &&
                    game.turnPlayer.id ===
                    player.id
                ) {

                    card.classList.add("active");
                }

                card.innerHTML = `
                    <div class="player-name">
                        ${escapeHtml(player.name)}
                    </div>

                    <div class="player-score">
                        ${player.score}
                    </div>
                `;

                players.appendChild(card);
            }
        );
    }


    function showQuestion(game) {

        const question =
            game.currentQuestion;

        if (!question) {
            return;
        }

        document
            .getElementById("questionScreen")
            .style.display = "flex";

        document
            .getElementById("questionPrice")
            .textContent =
            question.price;

        document
            .getElementById("questionText")
            .textContent =
            question.text;

        document
            .getElementById("answerText")
            .textContent =
            question.answer ?? "—";

        const status =
            document.getElementById(
                "answeringStatus"
            );

        const startButton =
            document.getElementById(
                "startAnsweringButton"
            );

        if (
            game.state === "QUESTION"
        ) {

            status.textContent =
                "Ведущий показывает вопрос";

            startButton.classList.remove(
                "hidden"
            );

        } else {

            startButton.classList.add(
                "hidden"
            );

            if (game.buzzedPlayer) {

                status.textContent =
                    `${game.buzzedPlayer.name} отвечает`;

            } else {

                status.textContent =
                    "Игроки могут нажимать кнопку";
            }
        }
    }


    function hideQuestion() {

        document
            .getElementById("questionScreen")
            .style.display = "none";
    }


    async function selectQuestion(
        category,
        price
    ) {

        try {

            await fetch(
                `/api/game/question/select?category=${encodeURIComponent(category)}&price=${price}`,
                {
                    method: "POST"
                }
            );

        } catch (e) {

            console.error(e);
        }
    }


    async function startAnswering() {

        try {

            await fetch(
                "/api/game/answering",
                {
                    method: "POST"
                }
            );

        } catch (e) {

            console.error(e);
        }
    }


    async function answerCorrect() {

        try {

            await fetch(
                "/api/game/answer/correct",
                {
                    method: "POST"
                }
            );

        } catch (e) {

            console.error(e);
        }
    }


    async function answerIncorrect() {

        try {

            await fetch(
                "/api/game/answer/incorrect",
                {
                    method: "POST"
                }
            );

        } catch (e) {

            console.error(e);
        }
    }


    function hidePresentation() {

        if (presentationRunning) {
            return;
        }

        document
            .getElementById(
                "presentationScreen"
            )
            .classList.add("hidden");

        document
            .getElementById(
                "gameScreen"
            )
            .classList.remove("hidden");
    }


    function escapeHtml(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }


    const socket =
        new StompJs.Client({

            brokerURL:
                `${
                    location.protocol === "https:"
                        ? "wss"
                        : "ws"
                }://${window.location.host}/ws`,

            reconnectDelay: 2000,

            heartbeatIncoming: 10000,

            heartbeatOutgoing: 10000,

            onConnect: () => {

                console.log(
                    "Host WebSocket connected"
                );

                socket.subscribe(
                    "/topic/host",
                    message => {

                        try {

                            const event =
                                JSON.parse(
                                    message.body
                                );

                            if (event.game) {

                                updateGame(
                                    event.game
                                );
                            }

                        } catch (e) {

                            console.error(e);
                        }
                    }
                );

                loadGame();
            }

        });


    socket.activate();


    setInterval(
        loadGame,
        1000
    );


    restoreHost();

</script>
