<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>SiGame Local — Ведущий</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
        }

        h1 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            margin: 10px 0;
        }

        button {
            padding: 14px 20px;
            font-size: 18px;
            cursor: pointer;
        }

        .players {
            margin-top: 30px;
        }

        .player {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
        }

        .hidden {
            display: none;
        }

        #error {
            color: red;
        }

    </style>

</head>

<body>

<div class="container">

    <!-- Создание ведущего -->

    <div id="hostSetup">

        <h1>SiGame Local</h1>

        <p>Вы первый участник.</p>

        <p>Введите имя ведущего:</p>

        <input
                id="hostName"
                type="text"
                placeholder="Например, Максим"
                maxlength="20"
        >

        <button onclick="becomeHost()">
            Стать ведущим
        </button>

        <p id="error"></p>

    </div>


    <!-- Панель ведущего -->

    <div id="hostPanel" class="hidden">

        <h1>Панель ведущего</h1>

        <p>
            Ведущий:
            <strong id="hostNameDisplay"></strong>
        </p>

        <div class="players">

            <h2>
                Игроки:
                <span id="playerCount">0</span>
            </h2>

            <div id="playersList"></div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

<script>

    /*
     * Показываем панель ведущего.
     */
    function showHostPanel(host) {

        document
            .getElementById("hostSetup")
            .classList.add("hidden");

        document
            .getElementById("hostPanel")
            .classList.remove("hidden");

        document
            .getElementById("hostNameDisplay")
            .textContent = host.name;

        loadPlayers();
    }


    /*
     * Создание ведущего.
     */
    async function becomeHost() {

        const name =
            document
                .getElementById("hostName")
                .value
                .trim();

        const error =
            document.getElementById("error");

        if (!name) {

            error.textContent =
                "Введите имя ведущего";

            return;
        }

        try {

            const response = await fetch(
                `/api/host?name=${encodeURIComponent(name)}`,
                {
                    method: "POST"
                }
            );

            if (!response.ok) {

                const message =
                    await response.text();

                error.textContent =
                    `Ошибка сервера: ${message}`;

                console.error(
                    "Host creation failed:",
                    response.status,
                    message
                );

                return;
            }


            /*
             * Получаем созданного ведущего.
             */
            const host =
                await response.json();


            /*
             * Сохраняем ID ведущего.
             */
            localStorage.setItem(
                "hostId",
                host.id
            );


            /*
             * Показываем панель.
             */
            showHostPanel(host);

        } catch (error) {

            console.error(error);

            document
                .getElementById("error")
                .textContent =
                "Ошибка подключения к серверу";
        }
    }


    /*
     * Восстановление ведущего после F5.
     */
    async function restoreHost() {

        const hostId =
            localStorage.getItem("hostId");

        /*
         * Это новый браузер/новый пользователь.
         */
        if (!hostId) {
            return;
        }

        try {

            const response =
                await fetch("/api/host");


            /*
             * Сервер не знает такого ведущего.
             *
             * Например, Spring Boot был
             * полностью перезапущен.
             */
            if (!response.ok) {

                localStorage.removeItem("hostId");

                return;
            }


            const host =
                await response.json();


            /*
             * Проверяем, что это именно
             * наш ведущий.
             */
            if (!host || host.id !== hostId) {

                localStorage.removeItem("hostId");

                return;
            }


            /*
             * Восстанавливаем панель.
             */
            showHostPanel(host);

        } catch (error) {

            console.error(
                "Failed to restore host:",
                error
            );
        }
    }


    /*
     * Загружаем список игроков.
     */
    async function loadPlayers() {

        try {

            const response =
                await fetch("/api/players");

            if (!response.ok) {
                return;
            }

            const players =
                await response.json();

            const list =
                document.getElementById("playersList");

            const count =
                document.getElementById("playerCount");


            count.textContent =
                players.length;

            list.innerHTML = "";


            players.forEach(player => {

                const element =
                    document.createElement("div");

                element.className =
                    "player";

                element.innerHTML = `
                    <span>${player.name}</span>
                    <span>${player.score} очков</span>
                `;

                list.appendChild(element);

            });

        } catch (error) {

            console.error(
                "Failed to load players:",
                error
            );
        }
    }


    /*
     * WebSocket.
     */
    const socket =
        new StompJs.Client({

            brokerURL:
                `ws://${window.location.host}/ws`,

            onConnect: () => {

                console.log(
                    "WebSocket connected"
                );


                socket.subscribe(
                    "/topic/game",
                    message => {

                        const event =
                            JSON.parse(message.body);

                        console.log(
                            "Game event:",
                            event
                        );


                        if (
                            event.type ===
                            "PLAYER_JOINED"
                        ) {

                            loadPlayers();
                        }

                    }
                );

            },

            onWebSocketError:
                error => {

                    console.error(
                        "WebSocket error:",
                        error
                    );
                },

            onStompError:
                frame => {

                    console.error(
                        "STOMP error:",
                        frame
                    );
                }
        });


    socket.activate();


    /*
     * При загрузке страницы
     * пытаемся восстановить ведущего.
     */
    restoreHost();

</script>

</body>

</html>
