<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SiGame Local</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 20px 0 10px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        #error {
            color: red;
            margin-top: 10px;
        }

        #playerName {
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Экран входа -->
    <div id="loginScreen">

        <h1>SiGame Local</h1>

        <p>Введите своё имя</p>

        <input
                id="nameInput"
                type="text"
                placeholder="Например, Максим"
                maxlength="20"
        >

        <button id="joinButton">
            Войти в игру
        </button>

        <p id="error"></p>

    </div>


    <!-- Экран ожидания -->
    <div id="waitingScreen" class="hidden">

        <button onclick="sendTestMessage()">
            WebSocket test
        </button>

        <h1>Вы в игре</h1>

        <p>
            Игрок:
            <span id="playerName"></span>
        </p>

        <p>
            Ожидание игры
        </p>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

<script>

    const nameInput = document.getElementById("nameInput");
    const joinButton = document.getElementById("joinButton");

    const loginScreen = document.getElementById("loginScreen");
    const waitingScreen = document.getElementById("waitingScreen");

    const playerName = document.getElementById("playerName");
    const error = document.getElementById("error");

    const socket = new StompJs.Client({
        brokerURL: `ws://${window.location.host}/ws`,

        onConnect: () => {
            console.log("WebSocket connected!");

            socket.subscribe("/topic/game", message => {

                const event = JSON.parse(message.body);

                console.log("Game event:", event);

            });
        },

        onWebSocketError: error => {
            console.error("WebSocket error:", error);
        },

        onStompError: frame => {
            console.error("STOMP error:", frame);
        }
    });

    socket.activate();


    joinButton.addEventListener("click", joinGame);

    function sendTestMessage() {

        socket.publish({
            destination: "/app/test",
            body: "Hello"
        });

    }


    async function joinGame() {

        const name = nameInput.value.trim();

        if (!name) {
            error.textContent = "Введите имя";
            return;
        }

        error.textContent = "";

        try {

            const response = await fetch(
                `/api/players?name=${encodeURIComponent(name)}`,
                {
                    method: "POST"
                }
            );

            if (!response.ok) {
                throw new Error("Server Error");
            }

            const player = await response.json();

            console.log("Player:", player);

            playerName.textContent = player.name;

            loginScreen.classList.add("hidden");
            waitingScreen.classList.remove("hidden");

        } catch (e) {

            error.textContent =
                "Game connection error";

            console.error(e);
        }


    }

</script>

</body>
</html>
