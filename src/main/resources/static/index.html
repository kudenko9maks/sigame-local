<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>SiGame Local</title>
</head>

<body>

<p>Подключение к игре...</p>

<script>

  async function checkRole() {

    try {

      const response =
              await fetch(
                      "/api/role",
                      {
                        cache: "no-store"
                      }
              );

      if (!response.ok) {
        throw new Error(
                "Ошибка API: " + response.status
        );
      }

      const role =
              await response.text();


      if (role.trim() === "HOST") {

        window.location.href =
                "/host.html";

      } else {

        window.location.href =
                "/player.html";
      }


    } catch (error) {

      console.error(error);

      document.body.innerHTML = `
                <h2>Ошибка подключения к серверу</h2>
                <p>${error.message}</p>
            `;
    }
  }


  checkRole();

</script>

</body>

</html>
