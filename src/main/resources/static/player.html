<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>SiGame Local — Игрок</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            margin: 15px 0;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        #error {
            color: red;
        }

        #gameArea {
            margin-top: 30px;
        }

        #questionText {
            font-size: 24px;
            margin: 25px 0;
        }

        #buzzButton {
            width: 100%;
            min-height: 150px;
            font-size: 32px;
            font-weight: bold;
            border-radius: 20px;
        }

        #buzzButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

    </style>

</head>

<body>

<div class="container">

    <!-- Вход игрока -->
    <div id="login">

        <h1>SiGame Local</h1>

        <p>Введите своё имя</p>

        <input
                id="playerName"
                type="text"
                placeholder="Например, Андрей"
                maxlength="20"
        >

        <button onclick="joinGame()">
            Войти в игру
        </button>

        <p id="error"></p>

    </div>


    <!-- Игрок уже вошёл -->
    <div id="waiting" class="hidden">

        <h1>Ты в игре!</h1>

        <p>
            Игрок:
            <strong id="nameDisplay"></strong>
        </p>

        <p>
            Ждём начала игры...
        </p>

        <p>
            Очки:
            <strong id="score">0</strong>
        </p>

        <div id="gameArea">

            <p id="gameStatus">
                Ждём начала игры...
            </p>

            <h2 id="questionText"></h2>

            <button
                    id="buzzButton"
                    class="hidden"
                    onclick="buzz()"
            >
                Я ЗНАЮ!
            </button>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

<script>

    let currentPlayer = null;
    let currentGame = null

    function showPlayerScreen(player) {

        currentPlayer = player;

        document
            .getElementById("nameDisplay")
            .textContent = player.name;

        document
            .getElementById("score")
            .textContent = player.score;

        document
            .getElementById("login")
            .classList.add("hidden");

        document
            .getElementById("waiting")
            .classList.remove("hidden");
    }


    async function joinGame() {

        const name =
            document
                .getElementById("playerName")
                .value
                .trim();

        const error =
            document.getElementById("error");

        if (!name) {

            error.textContent =
                "Введите имя";

            return;
        }

        try {

            const response = await fetch(
                `/api/players?name=${encodeURIComponent(name)}`,
                {
                    method: "POST"
                }
            );

            if (!response.ok) {

                error.textContent =
                    "Не удалось войти в игру";

                return;
            }

            const player =
                await response.json();


            localStorage.setItem(
                "playerId",
                player.id
            );

            showPlayerScreen(player);

        } catch (error) {

            console.error(error);

            document
                .getElementById("error")
                .textContent =
                "Ошибка подключения";
        }
    }



    async function restorePlayer() {

        const playerId =
            localStorage.getItem("playerId");

        if (!playerId) {
            return;
        }

        try {

            const response =
                await fetch(
                    `/api/players/${playerId}/snapshot`
                );

            if (!response.ok) {

                localStorage.removeItem(
                    "playerId"
                );

                return;
            }

            const snapshot =
                await response.json();

            const player =
                snapshot.player;

            showPlayerScreen(player);

            updateGameState(
                snapshot.game
            );

        } catch (error) {

            console.error(
                "Failed to restore player:",
                error
            );
        }
    }

    function updateGameState(game) {

        currentGame = game;

        const status =
            document.getElementById("gameStatus");

        const question =
            document.getElementById("questionText");

        const button =
            document.getElementById("buzzButton");



        if (game.state === "WAITING") {

            status.textContent =
                "Ждём начала игры...";

            question.textContent = "";

            button.classList.add("hidden");

            return;
        }


        if (game.state === "QUESTION") {

            status.textContent =
                "Вопрос";

            question.textContent =
                game.currentQuestion.text;

            button.classList.add("hidden");

            return;
        }


        if (game.state === "ANSWERING") {

            question.textContent =
                game.currentQuestion.text;

            if (game.buzzedPlayer) {

                button.classList.remove("hidden");
                button.disabled = true;

                if (
                    game.buzzedPlayer.id ===
                    currentPlayer.id
                ) {

                    status.textContent =
                        "Вы первый! Отвечайте!";

                } else {

                    status.textContent =
                        `${game.buzzedPlayer.name} отвечает`;

                }

            } else {

                status.textContent =
                    "Нажмите кнопку, если знаете ответ";

                button.classList.remove("hidden");
                button.disabled = false;
            }

            return;
        }


        if (game.state === "FINISHED") {

            status.textContent =
                "Игра закончена";

            button.classList.add("hidden");
        }
    }

    async function buzz() {

        if (!currentPlayer) {
            return;
        }

        if (!currentGame) {
            return;
        }

        if (currentGame.state !== "ANSWERING") {
            return;
        }

        const button =
            document.getElementById("buzzButton");


        button.disabled = true;

        try {

            const response = await fetch(
                `/api/game/buzz/${currentPlayer.id}`,
                {
                    method: "POST"
                }
            );

            if (!response.ok) {

                button.disabled = false;

                console.error(
                    "Buzz failed:",
                    response.status
                );

                return;
            }

            const player =
                await response.json();

            console.log(
                "Buzz result:",
                player
            );

        } catch (error) {

            console.error(
                "Buzz error:",
                error
            );

            button.disabled = false;
        }
    }


    const socket = new StompJs.Client({

        brokerURL:
            `ws://${window.location.host}/ws`,

        onConnect: () => {

            console.log("WebSocket connected");

            socket.subscribe(
                "/topic/game",
                message => {

                    const event =
                        JSON.parse(message.body);

                    console.log(
                        "Game event:",
                        event
                    );

                    handleGameEvent(event);
                }
            );

        },

        onWebSocketError: error => {

            console.error(
                "WebSocket error:",
                error
            );
        },

        onStompError: frame => {

            console.error(
                "STOMP error:",
                frame
            );
        }
    });

    function handleGameEvent(event) {

        if (
            event.type === "GAME_UPDATED" ||
            event.type === "PLAYER_BUZZED"
        ) {

            updateGameState(
                event.game
            );
        }

    }


    socket.activate();


    restorePlayer();

</script>

</body>

</html>
