<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>SiGame Local — Игрок</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            margin: 15px 0;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        #error {
            color: red;
        }

    </style>

</head>

<body>

<div class="container">

    <div id="login">

        <h1>SiGame Local</h1>

        <p>Введите своё имя</p>

        <input
                id="playerName"
                type="text"
                placeholder="Например, Андрей"
                maxlength="20"
        >

        <button onclick="joinGame()">
            Войти в игру
        </button>

        <p id="error"></p>

    </div>


    <div id="waiting" class="hidden">

        <h1>Ты в игре!</h1>

        <p>
            Игрок:
            <strong id="nameDisplay"></strong>
        </p>

        <p>
            Ждём начала игры...
        </p>

        <p>
            Очки: <strong id="score">0</strong>
        </p>

    </div>

</div>


<script>

    async function joinGame() {

        const name =
            document
                .getElementById("playerName")
                .value
                .trim();

        const error =
            document.getElementById("error");

        if (!name) {

            error.textContent =
                "Введите имя";

            return;
        }

        try {

            const response = await fetch(
                `/api/players?name=${encodeURIComponent(name)}`,
                {
                    method: "POST"
                }
            );

            if (!response.ok) {

                error.textContent =
                    "Не удалось войти в игру";

                return;
            }

            const player =
                await response.json();

            document
                .getElementById("nameDisplay")
                .textContent = player.name;

            document
                .getElementById("score")
                .textContent = player.score;

            document
                .getElementById("login")
                .classList.add("hidden");

            document
                .getElementById("waiting")
                .classList.remove("hidden");

        } catch (error) {

            console.error(error);

            document
                .getElementById("error")
                .textContent =
                "Ошибка подключения";
        }

    }

</script>

</body>

</html>
