<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>SiGame — Игрок</title>

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
        }


        body {

            font-family: Arial, sans-serif;

            background: #050b3d;

            color: white;

            overflow: hidden;

            user-select: none;

            -webkit-user-select: none;
        }


        /* =========================
           LOGIN
           ========================= */

        #login {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 25px;
        }


        #login h1 {

            font-size: 42px;

            margin-bottom: 40px;
        }


        #name,
        #joinButton {

            width: 100%;
            max-width: 400px;
        }


        #name {

            padding: 18px;

            border: 0;

            border-radius: 12px;

            font-size: 22px;

            text-align: center;

            outline: none;
        }


        #joinButton {

            margin-top: 15px;

            padding: 18px;

            border: 0;

            border-radius: 12px;

            font-size: 22px;

            font-weight: bold;

            cursor: pointer;
        }


        #error {

            margin-top: 20px;

            color: #ff8a8a;

            text-align: center;
        }


        /* =========================
           PLAYER SCREEN
           ========================= */

        #playerScreen {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;
        }


        /* =========================
           HEADER
           ========================= */

        #playerHeader {

            min-height: 100px;

            padding: 15px 20px;

            display: flex;

            align-items: center;
            justify-content: space-between;

            background: #070d52;

            border-bottom: 2px solid #6972c7;
        }


        #playerName {

            font-size: 24px;

            font-weight: bold;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        #scoreContainer {

            text-align: right;
        }


        #score {

            font-size: 32px;

            font-weight: bold;
        }


        #scoreLabel {

            font-size: 14px;

            opacity: 0.7;
        }


        /* =========================
           MAIN
           ========================= */

        #playerMain {

            flex: 1;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        #gameStatus {

            margin: 0 0 30px;

            text-align: center;

            font-size: 24px;

            font-weight: bold;
        }


        /* =========================
           BUZZ BUTTON
           ========================= */

        #buzzButton {

            width: min(80vw, 420px);

            height: min(80vw, 420px);

            max-height: 55vh;

            border-radius: 50%;

            border: 8px solid #8992ff;

            background: #101a7a;

            color: white;

            font-size: clamp(
                    32px,
                    8vw,
                    64px
            );

            font-weight: 900;

            cursor: pointer;

            box-shadow:
                    0 0 30px
                    rgba(
                            100,
                            110,
                            255,
                            0.3
                    );

            transition:
                    transform 0.08s;
        }


        #buzzButton:active {

            transform: scale(
                    0.94
            );
        }


        #buzzButton:disabled {

            opacity: 0.35;

            cursor: default;

            transform: none;
        }


        /* =========================
           WAITING
           ========================= */

        #waitingMessage {

            text-align: center;

            font-size: 22px;

            opacity: 0.8;
        }


        /* =========================
           FOOTER
           ========================= */

        #playerFooter {

            min-height: 50px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 14px;

            opacity: 0.5;
        }


        .hidden {

            display: none !important;
        }

    </style>

</head>


<body>


<!-- =========================
     LOGIN
     ========================= -->

<div id="login">

    <h1>SiGame</h1>


    <input
            id="name"
            type="text"
            placeholder="Введите имя"
            maxlength="20"
            autocomplete="off"
    >


    <button
            id="joinButton"
            onclick="joinGame()"
    >
        Войти в игру
    </button>


    <div id="error"></div>

</div>


<!-- =========================
     PLAYER
     ========================= -->

<div
        id="playerScreen"
        class="hidden"
>

    <header id="playerHeader">

        <div id="playerName">
            Игрок
        </div>


        <div id="scoreContainer">

            <div id="score">
                0
            </div>


            <div id="scoreLabel">
                очков
            </div>

        </div>

    </header>


    <main id="playerMain">

        <p id="gameStatus">
            Ждём начала игры...
        </p>


        <button
                id="buzzButton"
                class="hidden"
                onclick="buzz()"
        >
            Я ЗНАЮ!
        </button>


        <div
                id="waitingMessage"
                class="hidden"
        >
            Ждём следующего вопроса...
        </div>

    </main>


    <footer id="playerFooter">

        SiGame Local

    </footer>

</div>


<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>


<script>

    let currentPlayer = null;


    /*
     * Этот флаг означает:
     *
     * "Я уже нажимал кнопку в текущем вопросе".
     *
     * Он НЕ сбрасывается после неправильного ответа.
     *
     * Сбрасывается только после окончания вопроса.
     */

    let answeredThisQuestion =
        sessionStorage.getItem(
            "sigameAnsweredThisQuestion"
        ) === "true";


    let lastState = null;


    /* =========================
       SHOW PLAYER
       ========================= */

    function showPlayerScreen(player) {

        currentPlayer =
            player;


        document
            .getElementById(
                "playerName"
            )
            .textContent =
            player.name;


        document
            .getElementById(
                "score"
            )
            .textContent =
            player.score;


        document
            .getElementById(
                "login"
            )
            .classList.add(
            "hidden"
        );


        document
            .getElementById(
                "playerScreen"
            )
            .classList.remove(
            "hidden"
        );
    }


    /* =========================
       JOIN
       ========================= */

    async function joinGame() {

        const name =
            document
                .getElementById(
                    "name"
                )
                .value
                .trim();


        const error =
            document
                .getElementById(
                    "error"
                );


        if (!name) {

            error.textContent =
                "Введите имя";

            return;
        }


        try {

            const response =
                await fetch(
                    `/api/players?name=${encodeURIComponent(name)}`,
                    {
                        method: "POST"
                    }
                );


            if (!response.ok) {

                error.textContent =
                    await response.text();

                return;
            }


            const player =
                await response.json();


            localStorage.setItem(
                "playerId",
                player.id
            );


            /*
             * Новый игрок / новый вход.
             */

            sessionStorage.removeItem(
                "sigameAnsweredThisQuestion"
            );


            answeredThisQuestion =
                false;


            showPlayerScreen(
                player
            );


            await restorePlayer();


        } catch (e) {

            console.error(e);

            error.textContent =
                "Ошибка подключения";
        }
    }


    /* =========================
       RESTORE
       ========================= */

    async function restorePlayer() {

        const playerId =
            localStorage.getItem(
                "playerId"
            );


        if (!playerId) {

            return;
        }


        try {

            const response =
                await fetch(
                    `/api/players/${playerId}/snapshot`,
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                localStorage.removeItem(
                    "playerId"
                );


                sessionStorage.removeItem(
                    "sigameAnsweredThisQuestion"
                );


                answeredThisQuestion =
                    false;


                return;
            }


            const snapshot =
                await response.json();


            showPlayerScreen(
                snapshot.player
            );


            updatePlayerState(
                snapshot
            );


        } catch (error) {

            console.error(
                "Failed to restore player:",
                error
            );
        }
    }


    /* =========================
       PLAYER STATE
       ========================= */

    function updatePlayerState(
        snapshot
    ) {

        currentPlayer =
            snapshot.player;


        document
            .getElementById(
                "score"
            )
            .textContent =
            currentPlayer.score;


        const status =
            document.getElementById(
                "gameStatus"
            );


        const button =
            document.getElementById(
                "buzzButton"
            );


        const waiting =
            document.getElementById(
                "waitingMessage"
            );


        /*
         * =========================
         * BOARD / LOBBY
         * =========================
         *
         * Вопрос закончился.
         * Снимаем блокировку.
         */

        if (
            snapshot.state === "BOARD" ||
            snapshot.state === "LOBBY" ||
            snapshot.state === "WAITING"
        ) {

            answeredThisQuestion =
                false;


            sessionStorage.removeItem(
                "sigameAnsweredThisQuestion"
            );


            lastState =
                snapshot.state;


            button.classList.add(
                "hidden"
            );


            button.disabled =
                false;


            waiting.classList.toggle(
                "hidden",
                snapshot.state !== "BOARD"
            );


            status.textContent =
                snapshot.state === "BOARD"
                    ? "Ждём следующий вопрос..."
                    : "Ждём начала игры...";


            return;
        }


        /*
         * =========================
         * QUESTION
         * =========================
         */

        if (
            snapshot.state === "QUESTION"
        ) {

            /*
             * Если это переход
             * к новому вопросу —
             * сбрасываем предыдущую блокировку.
             */

            if (
                lastState !== "QUESTION" &&
                lastState !== "ANSWERING"
            ) {

                answeredThisQuestion =
                    false;


                sessionStorage.removeItem(
                    "sigameAnsweredThisQuestion"
                );
            }


            lastState =
                snapshot.state;


            status.textContent =
                "Ведущий открыл вопрос";


            button.classList.add(
                "hidden"
            );


            button.disabled =
                false;


            waiting.classList.add(
                "hidden"
            );


            return;
        }


        /*
         * =========================
         * ANSWERING
         * =========================
         */

        if (
            snapshot.state === "ANSWERING"
        ) {

            lastState =
                snapshot.state;


            waiting.classList.add(
                "hidden"
            );


            /*
             * Я уже отвечал.
             *
             * Даже если ведущий нажал
             * "Неправильно", кнопку
             * НЕ возвращаем.
             */

            if (
                answeredThisQuestion
            ) {

                button.classList.remove(
                    "hidden"
                );


                button.disabled =
                    true;


                if (
                    snapshot.buzzedPlayer &&
                    snapshot.buzzedPlayer.id ===
                    currentPlayer.id
                ) {

                    status.textContent =
                        "ВЫ ПЕРВЫЙ!";

                } else {

                    status.textContent =
                        "Вы уже отвечали";
                }


                return;
            }


            /*
             * Кто-то сейчас отвечает.
             */

            if (
                snapshot.buzzedPlayer
            ) {

                button.classList.remove(
                    "hidden"
                );


                button.disabled =
                    true;


                if (
                    snapshot.buzzedPlayer.id ===
                    currentPlayer.id
                ) {

                    answeredThisQuestion =
                        true;


                    sessionStorage.setItem(
                        "sigameAnsweredThisQuestion",
                        "true"
                    );


                    status.textContent =
                        "ВЫ ПЕРВЫЙ!";

                } else {

                    status.textContent =
                        `${snapshot.buzzedPlayer.name} отвечает`;
                }


                return;
            }


            /*
             * Никто не отвечает.
             */

            status.textContent =
                "ЖМИ!";


            button.classList.remove(
                "hidden"
            );


            button.disabled =
                !snapshot.canBuzz;


            return;
        }


        /*
         * =========================
         * FINISHED
         * =========================
         */

        if (
            snapshot.state ===
            "FINISHED"
        ) {

            lastState =
                snapshot.state;


            status.textContent =
                "Игра закончена";


            button.classList.add(
                "hidden"
            );


            waiting.classList.add(
                "hidden"
            );
        }
    }


    /* =========================
       BUZZ
       ========================= */

    async function buzz() {

        if (
            !currentPlayer ||
            answeredThisQuestion
        ) {

            return;
        }


        const button =
            document.getElementById(
                "buzzButton"
            );


        /*
         * Сразу фиксируем,
         * что игрок уже нажал.
         */

        answeredThisQuestion =
            true;


        sessionStorage.setItem(
            "sigameAnsweredThisQuestion",
            "true"
        );


        button.disabled =
            true;


        try {

            const response =
                await fetch(
                    `/api/game/buzz/${currentPlayer.id}`,
                    {
                        method: "POST"
                    }
                );


            if (!response.ok) {

                console.error(
                    "Buzz failed:",
                    await response.text()
                );


                /*
                 * Специально НЕ разблокируем.
                 *
                 * Серверное состояние
                 * будет источником истины.
                 */

                return;
            }


            const player =
                await response.json();


            console.log(
                "Buzz result:",
                player
            );


        } catch (error) {

            console.error(
                "Buzz error:",
                error
            );
        }
    }


    /* =========================
       WEBSOCKET
       ========================= */

    const socket =
        new StompJs.Client({

            brokerURL:
                `${
                    location.protocol === "https:"
                        ? "wss"
                        : "ws"
                }://${window.location.host}/ws`,


            reconnectDelay: 2000,


            heartbeatIncoming: 10000,


            heartbeatOutgoing: 10000,


            onConnect: () => {

                console.log(
                    "Player WebSocket connected"
                );


                socket.subscribe(
                    "/topic/players",
                    message => {

                        try {

                            const event =
                                JSON.parse(
                                    message.body
                                );


                            if (
                                event.snapshot
                            ) {

                                updatePlayerState(
                                    event.snapshot
                                );
                            }


                        } catch (e) {

                            console.error(
                                "Player WS message error:",
                                e
                            );
                        }
                    }
                );


                restorePlayer();
            },


            onDisconnect: () => {

                console.log(
                    "Player WebSocket disconnected"
                );
            },


            onWebSocketClose: () => {

                console.log(
                    "Player WebSocket closed"
                );
            },


            onWebSocketError: error => {

                console.error(
                    "Player WebSocket error:",
                    error
                );
            },


            onStompError: frame => {

                console.error(
                    "Player STOMP error:",
                    frame
                );
            }

        });


    socket.activate();


    /*
     * Дополнительная синхронизация.
     *
     * В норме WebSocket обновляет
     * состояние мгновенно.
     *
     * Если WebSocket временно
     * отвалится — REST восстановит
     * состояние автоматически.
     */

    setInterval(
        restorePlayer,
        1000
    );


    /* =========================
       START
       ========================= */

    restorePlayer();

</script>

</body>

</html>
