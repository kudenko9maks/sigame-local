<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>SiGame — Игрок</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
        }


        body {

            font-family: Arial, sans-serif;

            background: #050b3d;

            color: white;

            overflow: hidden;

            user-select: none;

            -webkit-user-select: none;
        }


        .hidden {
            display: none !important;
        }


        #login {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 25px;
        }


        #login h1 {

            font-size: 42px;

            margin-bottom: 40px;
        }


        #name,
        #joinButton {

            width: 100%;

            max-width: 400px;
        }


        #name {

            padding: 18px;

            border: 0;

            border-radius: 12px;

            font-size: 22px;

            text-align: center;

            outline: none;
        }


        #joinButton {

            margin-top: 15px;

            padding: 18px;

            border: 0;

            border-radius: 12px;

            font-size: 22px;

            font-weight: bold;

            cursor: pointer;
        }


        #error {

            margin-top: 20px;

            color: #ff8a8a;

            text-align: center;
        }


        #playerScreen {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;
        }


        #playerHeader {

            min-height: 100px;

            padding: 15px 20px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background: #070d52;

            border-bottom: 2px solid #6972c7;
        }


        #playerName {

            font-size: 24px;

            font-weight: bold;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        #scoreContainer {

            text-align: right;
        }


        #score {

            font-size: 32px;

            font-weight: bold;
        }


        #scoreLabel {

            font-size: 14px;

            opacity: .7;
        }


        #playerMain {

            flex: 1;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        #gameStatus {

            margin: 0 0 30px;

            text-align: center;

            font-size: 24px;

            font-weight: bold;
        }


        #buzzButton {

            width: min(80vw,420px);

            height: min(80vw,420px);

            max-height: 55vh;

            border-radius: 50%;

            border: 8px solid #8992ff;

            background: #101a7a;

            color: white;

            font-size:
                    clamp(
                            32px,
                            8vw,
                            64px
                    );

            font-weight: 900;

            cursor: pointer;

            box-shadow:
                    0 0 30px
                    rgba(
                            100,
                            110,
                            255,
                            .3
                    );

            transition:
                    transform .08s;
        }


        #buzzButton:active {

            transform:
                    scale(.94);
        }


        #buzzButton:disabled {

            opacity: .35;

            cursor: default;

            transform: none;
        }


        #waitingMessage {

            text-align: center;

            font-size: 22px;

            opacity: .8;
        }


        #playerFooter {

            min-height: 50px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 14px;

            opacity: .5;
        }


        /* =====================================================
           ANSWER REVEAL
           ===================================================== */

        #answerReveal {

            position: fixed;

            inset: 0;

            z-index: 100;

            display: none;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 30px;

            background: #050b3d;
        }


        #answerRevealTitle {

            font-size: 32px;

            margin-bottom: 25px;

            opacity: .8;
        }


        #answerRevealText {

            max-width: 90vw;

            font-size: 42px;

            font-weight: bold;

            line-height: 1.2;
        }

    </style>

</head>

<body>


<div id="login">

    <h1>SiGame</h1>

    <input
            id="name"
            type="text"
            placeholder="Введите имя"
            maxlength="20"
            autocomplete="off"
    >

    <button
            id="joinButton"
            onclick="joinGame()"
    >
        Войти в игру
    </button>

    <div id="error"></div>

</div>


<div
        id="playerScreen"
        class="hidden"
>

    <header id="playerHeader">

        <div id="playerName">
            Игрок
        </div>

        <div id="scoreContainer">

            <div id="score">
                0
            </div>

            <div id="scoreLabel">
                очков
            </div>

        </div>

    </header>


    <main id="playerMain">

        <p id="gameStatus">
            Ждём начала игры...
        </p>


        <button
                id="buzzButton"
                class="hidden"
                onclick="buzz()"
        >
            Я ЗНАЮ!
        </button>


        <div
                id="waitingMessage"
                class="hidden"
        >
            Ждём следующего вопроса...
        </div>

    </main>


    <footer id="playerFooter">
        SiGame Local
    </footer>

</div>


<div id="answerReveal">

    <div id="answerRevealTitle">
        ПРАВИЛЬНЫЙ ОТВЕТ
    </div>

    <div id="answerRevealText"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

<script>

    let currentPlayer = null;


    let answeredThisQuestion =
        sessionStorage.getItem(
            "sigameAnsweredThisQuestion"
        ) === "true";


    let lastState = null;


    /*
     * ============================================================
     * PLAYER
     * ============================================================
     */

    function showPlayerScreen(player) {

        currentPlayer =
            player;


        document
            .getElementById(
                "playerName"
            )
            .textContent =
            player.name;


        document
            .getElementById(
                "score"
            )
            .textContent =
            player.score;


        document
            .getElementById(
                "login"
            )
            .classList.add(
            "hidden"
        );


        document
            .getElementById(
                "playerScreen"
            )
            .classList.remove(
            "hidden"
        );
    }


    /*
     * ============================================================
     * JOIN
     * ============================================================
     */

    async function joinGame() {

        const name =
            document
                .getElementById(
                    "name"
                )
                .value
                .trim();


        const error =
            document.getElementById(
                "error"
            );


        if (!name) {

            error.textContent =
                "Введите имя";

            return;
        }


        try {

            const response =
                await fetch(
                    `/api/players?name=${encodeURIComponent(name)}`,
                    {
                        method: "POST"
                    }
                );


            if (!response.ok) {

                error.textContent =
                    await response.text();

                return;
            }


            const player =
                await response.json();


            localStorage.setItem(
                "playerId",
                player.id
            );


            sessionStorage.removeItem(
                "sigameAnsweredThisQuestion"
            );


            answeredThisQuestion =
                false;


            showPlayerScreen(
                player
            );


            await restorePlayer();

        } catch (e) {

            console.error(e);

            error.textContent =
                "Ошибка подключения";
        }
    }


    /*
     * ============================================================
     * RESTORE
     * ============================================================
     */

    async function restorePlayer() {

        const playerId =
            localStorage.getItem(
                "playerId"
            );


        if (!playerId) {
            return;
        }


        try {

            const response =
                await fetch(
                    `/api/players/${playerId}/snapshot`,
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                localStorage.removeItem(
                    "playerId"
                );

                return;
            }


            const snapshot =
                await response.json();


            showPlayerScreen(
                snapshot.player
            );


            updatePlayerState(
                snapshot
            );

        } catch (error) {

            console.error(
                "Failed to restore player:",
                error
            );
        }
    }


    /*
     * ============================================================
     * STATE
     * ============================================================
     */

    function updatePlayerState(
        snapshot
    ) {

        currentPlayer =
            snapshot.player;


        document
            .getElementById(
                "score"
            )
            .textContent =
            currentPlayer.score;


        const status =
            document.getElementById(
                "gameStatus"
            );


        const button =
            document.getElementById(
                "buzzButton"
            );


        const waiting =
            document.getElementById(
                "waitingMessage"
            );


        /*
         * =====================================================
         * ANSWER REVEAL
         * =====================================================
         */

        if (
            snapshot.state ===
            "ANSWER_REVEAL"
        ) {

            showAnswerReveal(
                snapshot
            );

            button.classList.add(
                "hidden"
            );

            waiting.classList.add(
                "hidden"
            );

            return;
        }


        hideAnswerReveal();


        /*
         * =====================================================
         * BOARD
         * =====================================================
         */

        if (
            snapshot.state ===
            "BOARD" ||
            snapshot.state ===
            "LOBBY"
        ) {

            answeredThisQuestion =
                false;


            sessionStorage.removeItem(
                "sigameAnsweredThisQuestion"
            );


            lastState =
                snapshot.state;


            button.classList.add(
                "hidden"
            );


            button.disabled =
                false;


            waiting.classList.toggle(
                "hidden",
                snapshot.state !==
                "BOARD"
            );


            status.textContent =
                snapshot.state ===
                "BOARD"
                    ? "Ждём следующий вопрос..."
                    : "Ждём начала игры...";


            return;
        }


        /*
         * =====================================================
         * QUESTION
         * =====================================================
         */

        if (
            snapshot.state ===
            "QUESTION"
        ) {

            /*
             * Новый вопрос.
             */

            if (
                lastState !==
                "QUESTION" &&
                lastState !==
                "ANSWERING"
            ) {

                answeredThisQuestion =
                    false;


                sessionStorage.removeItem(
                    "sigameAnsweredThisQuestion"
                );
            }


            lastState =
                snapshot.state;


            status.textContent =
                "Ведущий открыл вопрос";


            button.classList.add(
                "hidden"
            );


            button.disabled =
                false;


            waiting.classList.add(
                "hidden"
            );


            return;
        }


        /*
         * =====================================================
         * ANSWERING
         * =====================================================
         */

        if (
            snapshot.state ===
            "ANSWERING"
        ) {

            lastState =
                snapshot.state;


            waiting.classList.add(
                "hidden"
            );


            /*
             * Этот игрок уже отвечал.
             */

            if (
                answeredThisQuestion
            ) {

                button.classList.remove(
                    "hidden"
                );


                button.disabled =
                    true;


                status.textContent =
                    snapshot.buzzedPlayer &&
                    snapshot.buzzedPlayer.id ===
                    currentPlayer.id
                        ? "ВЫ ПЕРВЫЙ!"
                        : "Вы уже отвечали";


                return;
            }


            /*
             * Кто-то отвечает.
             */

            if (
                snapshot.buzzedPlayer
            ) {

                button.classList.remove(
                    "hidden"
                );


                button.disabled =
                    true;


                if (
                    snapshot.buzzedPlayer.id ===
                    currentPlayer.id
                ) {

                    answeredThisQuestion =
                        true;


                    sessionStorage.setItem(
                        "sigameAnsweredThisQuestion",
                        "true"
                    );


                    status.textContent =
                        "ВЫ ПЕРВЫЙ!";

                } else {

                    status.textContent =
                        `${snapshot.buzzedPlayer.name} отвечает`;
                }


                return;
            }


            /*
             * Никто не отвечает.
             */

            status.textContent =
                "ЖМИ!";


            button.classList.remove(
                "hidden"
            );


            button.disabled =
                !snapshot.canBuzz;


            return;
        }


        /*
         * =====================================================
         * FINISHED
         * =====================================================
         */

        if (
            snapshot.state ===
            "FINISHED"
        ) {

            lastState =
                snapshot.state;


            status.textContent =
                "Игра закончена";


            button.classList.add(
                "hidden"
            );


            waiting.classList.add(
                "hidden"
            );
        }
    }


    /*
     * ============================================================
     * ANSWER REVEAL
     * ============================================================
     */

    let answerRevealTimer =
        null;


    function showAnswerReveal(
        snapshot
    ) {

        const question =
            snapshot.currentQuestion;


        const title =
            document.getElementById(
                "answerRevealTitle"
            );


        const text =
            document.getElementById(
                "answerRevealText"
            );


        if (
            snapshot.eventType ===
            "ANSWER_CORRECT"
        ) {

            title.textContent =
                "ПРАВИЛЬНО!";

        } else {

            title.textContent =
                "ВРЕМЯ ВЫШЛО";
        }


        text.textContent =
            question &&
            question.answer
                ? question.answer
                : "—";


        document
            .getElementById(
                "answerReveal"
            )
            .style.display =
            "flex";


        clearTimeout(
            answerRevealTimer
        );


        answerRevealTimer =
            setTimeout(
                hideAnswerReveal,
                5000
            );
    }


    function hideAnswerReveal() {

        clearTimeout(
            answerRevealTimer
        );


        answerRevealTimer =
            null;


        document
            .getElementById(
                "answerReveal"
            )
            .style.display =
            "none";
    }


    /*
     * ============================================================
     * BUZZ
     * ============================================================
     */

    async function buzz() {

        if (
            !currentPlayer ||
            answeredThisQuestion
        ) {

            return;
        }


        const button =
            document.getElementById(
                "buzzButton"
            );


        answeredThisQuestion =
            true;


        sessionStorage.setItem(
            "sigameAnsweredThisQuestion",
            "true"
        );


        button.disabled =
            true;


        try {

            const response =
                await fetch(
                    `/api/game/buzz/${currentPlayer.id}`,
                    {
                        method: "POST"
                    }
                );


            if (!response.ok) {

                console.error(
                    "Buzz failed:",
                    await response.text()
                );
            }

        } catch (error) {

            console.error(
                "Buzz error:",
                error
            );
        }
    }


    /*
     * ============================================================
     * WEBSOCKET
     * ============================================================
     */

    const socket =
        new StompJs.Client({

            brokerURL:
                `${
                    location.protocol ===
                    "https:"
                        ? "wss"
                        : "ws"
                }://${window.location.host}/ws`,

            reconnectDelay: 2000,

            heartbeatIncoming: 10000,

            heartbeatOutgoing: 10000,


            onConnect: () => {

                console.log(
                    "Player WebSocket connected"
                );


                socket.subscribe(
                    "/topic/players",
                    message => {

                        try {

                            const event =
                                JSON.parse(
                                    message.body
                                );


                            if (
                                event.snapshot
                            ) {

                                updatePlayerState(
                                    event.snapshot
                                );
                            }

                        } catch (e) {

                            console.error(
                                "Player WS error:",
                                e
                            );
                        }
                    }
                );


                restorePlayer();
            }

        });


    socket.activate();


    setInterval(
        restorePlayer,
        1000
    );


    restorePlayer();

</script>

</body>

</html>
