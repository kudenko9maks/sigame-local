<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0"
  >

  <title>SiGame — TV</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;

      font-family: Arial, sans-serif;

      background: #050b3d;

      color: white;

      overflow: hidden;
    }

    .hidden {
      display: none !important;
    }

    #gameScreen {

      width: 100%;
      height: 100%;

      display: flex;

      flex-direction: column;
    }

    #header {

      height: 80px;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #070d52;

      border-bottom: 2px solid #6972c7;

      font-size: 38px;

      font-weight: bold;
    }

    #board {

      flex: 1;

      display: grid;

      gap: 3px;

      padding: 10px;
    }

    .category {

      display: flex;

      flex-direction: column;
    }

    .category-name {

      height: 75px;

      display: flex;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 10px;

      font-size: 24px;

      font-weight: bold;

      background: #080f66;

      border: 1px solid #8e96ff;
    }

    .question-cell {

      flex: 1;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 38px;

      font-weight: bold;

      background: #070d58;

      border: 1px solid #737bd3;
    }

    .question-cell.used {

      color: transparent;

      background: #03072d;
    }

    #turnInfo {

      min-height: 65px;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #070d52;

      border-top: 2px solid #6972c7;

      font-size: 28px;

      font-weight: bold;
    }

    #players {

      min-height: 95px;

      display: flex;

      justify-content: center;

      gap: 10px;

      padding: 8px;

      background: #03062b;
    }

    .player-card {

      min-width: 180px;

      padding: 8px 20px;

      text-align: center;

      background: #080f52;

      border: 2px solid #4e58bd;

      border-radius: 5px;
    }

    .player-card.active {

      border-color: white;

      background: #111a75;
    }

    .player-name {

      font-size: 19px;

      font-weight: bold;
    }

    .player-score {

      margin-top: 5px;

      font-size: 27px;

      font-weight: bold;
    }

    #questionScreen {

      position: fixed;

      inset: 0;

      z-index: 100;

      display: none;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 50px;

      background: #050b3d;
    }

    #questionPrice {

      font-size: 30px;

      margin-bottom: 45px;
    }

    #questionText {

      max-width: 1200px;

      font-size: 52px;

      line-height: 1.25;

      font-weight: bold;
    }

    #answeringStatus {

      margin-top: 60px;

      font-size: 34px;

      font-weight: bold;
    }

    #presentationScreen {

      position: fixed;

      inset: 0;

      z-index: 200;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      background: #050b3d;

      color: white;
    }

    #presentationRound {

      position: absolute;

      top: 35px;

      left: 0;

      width: 100%;

      text-align: center;

      font-size: 38px;

      font-weight: bold;

      opacity: .85;

      z-index: 5;
    }

    #presentationCategories {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 20px;

      font-size: 58px;

      font-weight: bold;

      text-align: center;
    }

    .presentation-category {

      flex-shrink: 0;

      white-space: nowrap;

      text-shadow:
              0 0 25px rgba(120,130,255,.6);
    }

    .initial-presentation {

      animation:
              initialPresentationMove
              10s
              linear
              forwards;
    }

    @keyframes initialPresentationMove {

      from {

        transform:
                translateY(-100vh);
      }

      to {

        transform:
                translateY(100vh);
      }
    }

    .round-presentation {

      animation:
              roundCategoryAnimation
              2s
              ease-in-out
              forwards;
    }

    @keyframes roundCategoryAnimation {

      0% {

        opacity: 0;

        transform:
                translateY(100px);
      }

      20% {

        opacity: 1;

        transform:
                translateY(0);
      }

      80% {

        opacity: 1;

        transform:
                translateY(0);
      }

      100% {

        opacity: 0;

        transform:
                translateY(-100px);
      }
    }

  </style>

</head>

<body>


<div id="presentationScreen" class="hidden">

  <div id="presentationRound"></div>

  <div id="presentationCategories"></div>

</div>


<div id="gameScreen">

  <div id="header">
    SiGame
  </div>

  <div id="board"></div>

  <div id="turnInfo">
    Ожидание игры...
  </div>

  <div id="players"></div>

</div>


<div id="questionScreen">

  <div id="questionPrice"></div>

  <div id="questionText"></div>

  <div id="answeringStatus"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

<script>

  let currentGame = null;

  let presentationTimer = null;

  let initialPresentationPlayed = false;

  let presentationRunning = false;


  function startInitialPresentation(game) {

    if (initialPresentationPlayed) {
      return;
    }

    initialPresentationPlayed = true;
    presentationRunning = true;

    clearTimeout(presentationTimer);

    const screen =
            document.getElementById(
                    "presentationScreen"
            );

    const container =
            document.getElementById(
                    "presentationCategories"
            );

    const title =
            document.getElementById(
                    "presentationRound"
            );

    container.innerHTML = "";
    container.className =
            "initial-presentation";

    title.textContent =
            "ИГРА НАЧИНАЕТСЯ";

    const categories = [];

    (game.pack?.rounds || []).forEach(
            round => {

              (round.categories || []).forEach(
                      category => {

                        categories.push(
                                category.name
                        );
                      }
              );
            }
    );

    categories.forEach(
            name => {

              const element =
                      document.createElement("div");

              element.className =
                      "presentation-category";

              element.textContent =
                      name;

              container.appendChild(
                      element
              );
            }
    );

    screen.classList.remove("hidden");

    document
            .getElementById("gameScreen")
            .classList.add("hidden");

    hideQuestion();

    presentationTimer =
            setTimeout(
                    () => {

                      startFirstRoundPresentation(
                              game
                      );

                    },
                    10000
            );
  }


  function startFirstRoundPresentation(game) {

    clearTimeout(presentationTimer);

    const screen =
            document.getElementById(
                    "presentationScreen"
            );

    const container =
            document.getElementById(
                    "presentationCategories"
            );

    const title =
            document.getElementById(
                    "presentationRound"
            );

    container.innerHTML = "";
    container.className = "";

    title.textContent =
            "РАУНД 1";

    screen.classList.remove("hidden");

    document
            .getElementById("gameScreen")
            .classList.add("hidden");

    const round =
            game.pack?.rounds?.[0];

    const categories =
            round?.categories || [];

    showRoundCategory(
            categories,
            0
    );
  }


  function showRoundCategory(
          categories,
          index
  ) {

    const container =
            document.getElementById(
                    "presentationCategories"
            );

    if (
            index >= categories.length
    ) {

      finishPresentation();

      return;
    }

    container.innerHTML = "";
    container.className = "";

    const element =
            document.createElement("div");

    element.className =
            "presentation-category round-presentation";

    element.textContent =
            categories[index].name;

    container.appendChild(
            element
    );

    presentationTimer =
            setTimeout(
                    () => {

                      showRoundCategory(
                              categories,
                              index + 1
                      );

                    },
                    2000
            );
  }


  function finishPresentation() {

    clearTimeout(presentationTimer);

    presentationRunning = false;

    document
            .getElementById(
                    "presentationScreen"
            )
            .classList.add("hidden");

    document
            .getElementById(
                    "gameScreen"
            )
            .classList.remove("hidden");

    loadGame();
  }


  function hidePresentation() {

    if (presentationRunning) {
      return;
    }

    document
            .getElementById(
                    "presentationScreen"
            )
            .classList.add("hidden");

    document
            .getElementById(
                    "gameScreen"
            )
            .classList.remove("hidden");
  }


  function updateGame(game) {

    currentGame = game;

    if (
            !initialPresentationPlayed &&
            game.pack &&
            game.currentRound === 0 &&
            game.state === "BOARD"
    ) {

      startInitialPresentation(game);

      return;
    }

    if (presentationRunning) {
      return;
    }

    if (
            game.state === "PRESENTATION"
    ) {

      return;
    }

    hidePresentation();

    if (
            game.state === "BOARD" ||
            game.state === "LOBBY"
    ) {

      hideQuestion();

      renderBoard(game);

      return;
    }

    if (
            game.state === "QUESTION" ||
            game.state === "ANSWERING"
    ) {

      renderBoard(game);

      showQuestion(game);

      return;
    }

    if (
            game.state === "FINISHED"
    ) {

      hideQuestion();

      renderBoard(game);
    }
  }


  function renderBoard(game) {

    const board =
            document.getElementById(
                    "board"
            );

    board.innerHTML = "";

    const categories =
            game.categories || [];

    if (!categories.length) {
      return;
    }

    board.style.gridTemplateColumns =
            `repeat(${categories.length}, 1fr)`;

    categories.forEach(
            category => {

              const column =
                      document.createElement(
                              "div"
                      );

              column.className =
                      "category";

              const title =
                      document.createElement(
                              "div"
                      );

              title.className =
                      "category-name";

              title.textContent =
                      category.name;

              column.appendChild(
                      title
              );

              (
                      category.questions || []
              ).forEach(
                      question => {

                        const cell =
                                document.createElement(
                                        "div"
                                );

                        cell.className =
                                "question-cell";

                        if (
                                question.used
                        ) {

                          cell.classList.add(
                                  "used"
                          );

                        } else {

                          cell.textContent =
                                  question.price;
                        }

                        column.appendChild(
                                cell
                        );
                      }
              );

              board.appendChild(
                      column
              );
            }
    );

    renderTurn(game);
    renderPlayers(game);
  }


  function renderTurn(game) {

    const turnInfo =
            document.getElementById(
                    "turnInfo"
            );

    turnInfo.textContent =
            game.turnPlayer
                    ? `Ходит: ${game.turnPlayer.name}`
                    : "Ожидание игры...";
  }


  function renderPlayers(game) {

    const players =
            document.getElementById(
                    "players"
            );

    players.innerHTML = "";

    (game.players || []).forEach(
            player => {

              const card =
                      document.createElement(
                              "div"
                      );

              card.className =
                      "player-card";

              if (
                      game.turnPlayer &&
                      game.turnPlayer.id ===
                      player.id
              ) {

                card.classList.add(
                        "active"
                );
              }

              card.innerHTML = `
                    <div class="player-name">
                        ${escapeHtml(player.name)}
                    </div>

                    <div class="player-score">
                        ${player.score}
                    </div>
                `;

              players.appendChild(
                      card
              );
            }
    );
  }


  function showQuestion(game) {

    const question =
            game.currentQuestion;

    if (!question) {
      return;
    }

    document
            .getElementById(
                    "questionScreen"
            )
            .style.display =
            "flex";

    document
            .getElementById(
                    "questionPrice"
            )
            .textContent =
            question.price;

    document
            .getElementById(
                    "questionText"
            )
            .textContent =
            question.text;

    const status =
            document.getElementById(
                    "answeringStatus"
            );

    if (
            game.state === "QUESTION"
    ) {

      status.textContent =
              "Ведущий показывает вопрос";

    } else if (
            game.buzzedPlayer
    ) {

      status.textContent =
              `${game.buzzedPlayer.name} отвечает`;

    } else {

      status.textContent =
              "ЖМИТЕ КНОПКУ!";
    }
  }


  function hideQuestion() {

    document
            .getElementById(
                    "questionScreen"
            )
            .style.display =
            "none";
  }


  function escapeHtml(value) {

    return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
  }


  const socket =
          new StompJs.Client({

            brokerURL:
                    `${
                            location.protocol === "https:"
                                    ? "wss"
                                    : "ws"
                    }://${window.location.host}/ws`,

            reconnectDelay: 2000,

            heartbeatIncoming: 10000,

            heartbeatOutgoing: 10000,

            onConnect: () => {

              console.log(
                      "TV WebSocket connected"
              );

              socket.subscribe(
                      "/topic/host",
                      message => {

                        try {

                          const event =
                                  JSON.parse(
                                          message.body
                                  );

                          if (event.game) {

                            updateGame(
                                    event.game
                            );
                          }

                        } catch (e) {

                          console.error(e);
                        }
                      }
              );

              loadGame();
            }

          });


  socket.activate();


  async function loadGame() {

    try {

      const response =
              await fetch(
                      "/api/game",
                      {
                        cache: "no-store"
                      }
              );

      if (!response.ok) {
        return;
      }

      const game =
              await response.json();

      updateGame(game);

    } catch (e) {

      console.error(e);
    }
  }


  setInterval(
          loadGame,
          1000
  );


  loadGame();

</script>

</body>

</html>
