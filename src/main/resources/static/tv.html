<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0"
  >

  <title>SiGame — TV</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;

      font-family: Arial, sans-serif;

      background: #050b3d;

      color: white;

      overflow: hidden;
    }


    /* =========================
       GAME
       ========================= */

    #gameScreen {

      width: 100%;
      height: 100%;

      display: flex;

      flex-direction: column;
    }


    /* =========================
       HEADER
       ========================= */

    #header {

      height: 80px;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #070d52;

      border-bottom: 2px solid #6972c7;

      font-size: 38px;

      font-weight: bold;
    }


    /* =========================
       BOARD
       ========================= */

    #board {

      flex: 1;

      display: grid;

      gap: 3px;

      padding: 10px;
    }


    .category {

      display: flex;

      flex-direction: column;
    }


    .category-name {

      height: 75px;

      display: flex;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 10px;

      font-size: 24px;

      font-weight: bold;

      background: #080f66;

      border: 1px solid #8e96ff;
    }


    .question-cell {

      flex: 1;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 38px;

      font-weight: bold;

      background: #070d58;

      border: 1px solid #737bd3;
    }


    .question-cell.used {

      color: transparent;

      background: #03072d;
    }


    /* =========================
       TURN
       ========================= */

    #turnInfo {

      min-height: 65px;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #070d52;

      border-top: 2px solid #6972c7;

      font-size: 28px;

      font-weight: bold;
    }


    /* =========================
       PLAYERS
       ========================= */

    #players {

      min-height: 95px;

      display: flex;

      justify-content: center;

      gap: 10px;

      padding: 8px;

      background: #03062b;
    }


    .player-card {

      min-width: 180px;

      padding: 8px 20px;

      text-align: center;

      background: #080f52;

      border: 2px solid #4e58bd;

      border-radius: 5px;
    }


    .player-card.active {

      border-color: white;

      background: #111a75;
    }


    .player-name {

      font-size: 19px;

      font-weight: bold;
    }


    .player-score {

      margin-top: 5px;

      font-size: 27px;

      font-weight: bold;
    }


    /* =========================
       QUESTION
       ========================= */

    #questionScreen {

      position: fixed;

      inset: 0;

      z-index: 100;

      display: none;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 50px;

      background: #050b3d;
    }


    #questionPrice {

      font-size: 30px;

      margin-bottom: 45px;
    }


    #questionText {

      max-width: 1200px;

      font-size: 52px;

      line-height: 1.25;

      font-weight: bold;
    }


    #answeringStatus {

      margin-top: 60px;

      font-size: 34px;

      font-weight: bold;
    }

  </style>

</head>


<body>


<div id="gameScreen">

  <div id="header">
    SiGame
  </div>


  <div id="board">
  </div>


  <div id="turnInfo">
    Ожидание игры...
  </div>


  <div id="players">
  </div>

</div>


<!-- =========================
     QUESTION
     ========================= -->

<div id="questionScreen">

  <div id="questionPrice"></div>


  <div id="questionText"></div>


  <div id="answeringStatus"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>


<script>

  let currentGame = null;


  /* =========================
     UPDATE GAME
     ========================= */

  function updateGame(game) {

    currentGame =
            game;


    if (
            game.state === "BOARD" ||
            game.state === "LOBBY"
    ) {

      hideQuestion();

      renderBoard(game);

      return;
    }


    if (
            game.state === "QUESTION" ||
            game.state === "ANSWERING"
    ) {

      renderBoard(game);

      showQuestion(game);

      return;
    }


    if (
            game.state === "FINISHED"
    ) {

      hideQuestion();

      renderBoard(game);
    }
  }


  /* =========================
     BOARD
     ========================= */

  function renderBoard(game) {

    const board =
            document.getElementById(
                    "board"
            );


    board.innerHTML = "";


    const categories =
            game.categories || [];


    if (
            categories.length === 0
    ) {

      return;
    }


    board.style.gridTemplateColumns =
            `repeat(${categories.length}, 1fr)`;


    categories.forEach(
            category => {

              const column =
                      document.createElement(
                              "div"
                      );


              column.className =
                      "category";


              const title =
                      document.createElement(
                              "div"
                      );


              title.className =
                      "category-name";


              title.textContent =
                      category.name;


              column.appendChild(
                      title
              );


              (
                      category.questions || []
              ).forEach(
                      question => {

                        const cell =
                                document.createElement(
                                        "div"
                                );


                        cell.className =
                                "question-cell";


                        if (
                                question.used
                        ) {

                          cell.classList.add(
                                  "used"
                          );

                        } else {

                          cell.textContent =
                                  question.price;
                        }


                        column.appendChild(
                                cell
                        );

                      }
              );


              board.appendChild(
                      column
              );
            }
    );


    renderTurn(game);

    renderPlayers(game);
  }


  /* =========================
     TURN
     ========================= */

  function renderTurn(game) {

    const turnInfo =
            document.getElementById(
                    "turnInfo"
            );


    turnInfo.textContent =
            game.turnPlayer
                    ? `Ходит: ${game.turnPlayer.name}`
                    : "Ожидание игры...";
  }


  /* =========================
     PLAYERS
     ========================= */

  function renderPlayers(game) {

    const players =
            document.getElementById(
                    "players"
            );


    players.innerHTML = "";


    (
            game.players || []
    ).forEach(
            player => {

              const card =
                      document.createElement(
                              "div"
                      );


              card.className =
                      "player-card";


              if (
                      game.turnPlayer &&
                      game.turnPlayer.id ===
                      player.id
              ) {

                card.classList.add(
                        "active"
                );
              }


              card.innerHTML = `
                    <div class="player-name">
                        ${escapeHtml(player.name)}
                    </div>

                    <div class="player-score">
                        ${player.score}
                    </div>
                `;


              players.appendChild(
                      card
              );
            }
    );
  }


  /* =========================
     HTML ESCAPE
     ========================= */

  function escapeHtml(value) {

    return String(value)

            .replaceAll(
                    "&",
                    "&amp;"
            )

            .replaceAll(
                    "<",
                    "&lt;"
            )

            .replaceAll(
                    ">",
                    "&gt;"
            )

            .replaceAll(
                    '"',
                    "&quot;"
            )

            .replaceAll(
                    "'",
                    "&#039;"
            );
  }


  /* =========================
     QUESTION
     ========================= */

  function showQuestion(game) {

    const question =
            game.currentQuestion;


    if (!question) {

      return;
    }


    document
            .getElementById(
                    "questionScreen"
            )
            .style.display =
            "flex";


    document
            .getElementById(
                    "questionPrice"
            )
            .textContent =
            question.price;


    document
            .getElementById(
                    "questionText"
            )
            .textContent =
            question.text;


    const status =
            document.getElementById(
                    "answeringStatus"
            );


    if (
            game.state === "QUESTION"
    ) {

      status.textContent =
              "Ведущий показывает вопрос";


    } else if (
            game.buzzedPlayer
    ) {

      status.textContent =
              `${game.buzzedPlayer.name} отвечает`;


    } else {

      status.textContent =
              "ЖМИТЕ КНОПКУ!";
    }
  }


  /* =========================
     HIDE QUESTION
     ========================= */

  function hideQuestion() {

    document
            .getElementById(
                    "questionScreen"
            )
            .style.display =
            "none";
  }


  /* =========================
     WEBSOCKET
     ========================= */

  const socket =
          new StompJs.Client({

            brokerURL:
                    `${
                            location.protocol === "https:"
                                    ? "wss"
                                    : "ws"
                    }://${window.location.host}/ws`,


            reconnectDelay: 2000,


            heartbeatIncoming: 10000,


            heartbeatOutgoing: 10000,


            onConnect: () => {

              console.log(
                      "TV WebSocket connected"
              );


              socket.subscribe(
                      "/topic/host",
                      message => {

                        try {

                          const event =
                                  JSON.parse(
                                          message.body
                                  );


                          if (
                                  event.game
                          ) {

                            updateGame(
                                    event.game
                            );
                          }


                        } catch (e) {

                          console.error(
                                  "TV WS message error:",
                                  e
                          );
                        }
                      }
              );


              loadGame();
            },


            onDisconnect: () => {

              console.log(
                      "TV WebSocket disconnected"
              );
            },


            onWebSocketClose: () => {

              console.log(
                      "TV WebSocket closed"
              );
            },


            onWebSocketError: error => {

              console.error(
                      "TV WebSocket error:",
                      error
              );
            },


            onStompError: frame => {

              console.error(
                      "TV STOMP error:",
                      frame
              );
            }

          });


  socket.activate();


  /* =========================
     LOAD GAME
     ========================= */

  async function loadGame() {

    try {

      const response =
              await fetch(
                      "/api/game",
                      {
                        cache: "no-store"
                      }
              );


      if (!response.ok) {

        return;
      }


      const game =
              await response.json();


      updateGame(game);


    } catch (e) {

      console.error(
              "TV game load error:",
              e
      );
    }
  }


  /*
   * Страховка на случай,
   * если WebSocket временно пропал.
   */

  setInterval(
          loadGame,
          1000
  );


  /* =========================
     START
     ========================= */

  loadGame();

</script>

</body>

</html>
