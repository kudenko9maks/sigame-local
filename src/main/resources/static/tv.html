<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0"
  >

  <title>SiGame — TV</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;

      font-family: Arial, sans-serif;

      background: #050b3d;

      color: white;

      overflow: hidden;
    }

    .hidden {
      display: none !important;
    }

    #gameScreen {

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;
    }

    #header {

      height: 80px;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #070d52;

      border-bottom: 2px solid #6972c7;

      font-size: 38px;

      font-weight: bold;
    }

    #board {

      flex: 1;

      display: grid;

      gap: 3px;

      padding: 10px;

      overflow: hidden;
    }

    .category {

      display: flex;

      flex-direction: column;

      min-width: 0;
    }

    .category-name {

      height: 75px;

      display: flex;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 10px;

      font-size: 24px;

      font-weight: bold;

      background: #080f66;

      border: 1px solid #8e96ff;
    }

    .question-cell {

      flex: 1;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 38px;

      font-weight: bold;

      background: #070d58;

      border: 1px solid #737bd3;
    }

    .question-cell.used {

      color: transparent;

      background: #03072d;
    }

    #turnInfo {

      min-height: 65px;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #070d52;

      border-top: 2px solid #6972c7;

      font-size: 28px;

      font-weight: bold;
    }

    #players {

      min-height: 95px;

      display: flex;

      justify-content: center;

      gap: 10px;

      padding: 8px;

      background: #03062b;

      overflow: hidden;
    }

    .player-card {

      min-width: 180px;

      padding: 8px 20px;

      text-align: center;

      background: #080f52;

      border: 2px solid #4e58bd;

      border-radius: 5px;
    }

    .player-card.active {

      border-color: white;

      background: #111a75;
    }

    .player-name {

      font-size: 19px;

      font-weight: bold;
    }

    .player-score {

      margin-top: 5px;

      font-size: 27px;

      font-weight: bold;
    }

    #questionScreen {

      position: fixed;

      inset: 0;

      z-index: 100;

      display: none;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 50px;

      background: #050b3d;
    }

    #questionPrice {

      font-size: 30px;

      margin-bottom: 45px;
    }

    #questionText {

      max-width: 1200px;

      font-size: 52px;

      line-height: 1.25;

      font-weight: bold;
    }

    .question-image {

      display: block;

      max-width: 100%;

      max-height: 65vh;

      width: auto;

      height: auto;

      object-fit: contain;

      margin: 0 auto;
    }

    .answer-image {

      display: block;

      max-width: 100%;

      max-height: 60vh;

      width: auto;

      height: auto;

      object-fit: contain;

      margin: 0 auto;
    }

    #answeringStatus {

      margin-top: 60px;

      font-size: 34px;

      font-weight: bold;
    }

    #answerTimer {

      position: absolute;

      left: 0;
      right: 0;

      bottom: 0;

      height: 18px;

      background: #02052a;

      z-index: 150;

      overflow: hidden;
    }

    #answerTimerFill {

      width: 0;

      height: 100%;

      background: white;

      transform-origin: left center;
    }

    #presentationScreen {

      position: fixed;

      inset: 0;

      z-index: 200;

      background: #050b3d;

      overflow: hidden;

      display: flex;

      align-items: center;

      justify-content: center;
    }

    #presentationRound {

      position: absolute;

      top: 35px;

      left: 0;

      width: 100%;

      z-index: 10;

      text-align: center;

      font-size: 38px;

      font-weight: bold;

      opacity: .85;
    }

    #presentationTrack {

      position: absolute;

      left: 0;

      top: 0;

      width: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 18px;

      font-size: 58px;

      font-weight: bold;

      text-align: center;

      will-change: transform;

      transform:
              translate3d(
                      0,
                      0,
                      0
              );
    }

    .presentation-category {

      flex: 0 0 auto;

      white-space: nowrap;

      text-shadow:
              0 0 25px
              rgba(
                      120,
                      130,
                      255,
                      .6
              );
    }

    .round-topic {

      position: absolute;

      left: 0;

      width: 100%;

      text-align: center;

      font-size: 62px;

      font-weight: bold;

      opacity: 0;

      transform:
              translate3d(
                      0,
                      120px,
                      0
              );

      will-change:
              transform,
              opacity;
    }

    #answerRevealScreen {

      position: fixed;

      inset: 0;

      z-index: 300;

      display: none;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 50px;

      background: #050b3d;
    }

    #answerRevealLabel {

      font-size: 36px;

      opacity: .8;

      margin-bottom: 30px;
    }

    #answerRevealText {

      max-width: 1300px;

      font-size: 64px;

      line-height: 1.2;

      font-weight: bold;
    }

  </style>

</head>

<body>

<div
        id="presentationScreen"
        class="hidden"
>

  <div id="presentationRound"></div>

  <div id="presentationTrack"></div>

</div>

<div id="gameScreen">

  <div id="header">
    SiGame
  </div>

  <div id="board"></div>

  <div id="turnInfo">
    Ожидание игры...
  </div>

  <div id="players"></div>

</div>

<div id="questionScreen">

  <div id="questionPrice"></div>

  <div id="questionText"></div>

  <div id="answeringStatus"></div>

  <div id="answerTimer">

    <div id="answerTimerFill"></div>

  </div>

</div>

<div id="answerRevealScreen">

  <div id="answerRevealLabel">
    ПРАВИЛЬНЫЙ ОТВЕТ
  </div>

  <div id="answerRevealText"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

<script>

  let currentGame = null;

  let presentationKey = null;

  let initialAnimationFrame = null;

  let roundAnimationFrame = null;

  let timerInterval = null;

  let answerRevealTimer = null;

  function getPresentationKey(game) {

    return (
            String(game.presentationType || "") +
            ":" +
            String(game.presentationStartedAt || "")
    );
  }

  function showPresentation(game) {

    const key =
            getPresentationKey(game);

    if (
            presentationKey === key
    ) {

      return;
    }

    stopPresentation();

    presentationKey =
            key;

    document
            .getElementById(
                    "presentationScreen"
            )
            .classList.remove(
            "hidden"
    );

    document
            .getElementById(
                    "gameScreen"
            )
            .classList.add(
            "hidden"
    );

    hideQuestion();

    if (
            game.presentationType ===
            "INITIAL"
    ) {

      startInitialPresentation(
              game
      );

      return;
    }

    if (
            game.presentationType ===
            "ROUND"
    ) {

      startRoundPresentation(
              game
      );

      return;
    }
  }

  function startInitialPresentation(game) {

    const track =
            document.getElementById(
                    "presentationTrack"
            );

    const title =
            document.getElementById(
                    "presentationRound"
            );

    track.innerHTML = "";

    title.textContent =
            "ИГРА НАЧИНАЕТСЯ";

    const categories = [];

    (
            game.pack?.rounds ||
            []
    ).forEach(
            round => {

              (
                      round.categories ||
                      []
              ).forEach(
                      category => {

                        categories.push(
                                category.name
                        );
                      }
              );
            }
    );

    categories.forEach(
            name => {

              const element =
                      document.createElement(
                              "div"
                      );

              element.className =
                      "presentation-category";

              element.textContent =
                      name;

              track.appendChild(
                      element
              );
            }
    );

    requestAnimationFrame(
            () => {

              const totalHeight =
                      track.getBoundingClientRect()
                              .height;

              const startY =
                      -totalHeight;

              const endY =
                      window.innerHeight;

              const duration =
                      game.presentationDuration ||
                      6500;

              function animate() {

                const elapsed =
                        Date.now() -
                        Number(
                                game.presentationStartedAt
                        );

                const progress =
                        Math.max(
                                0,
                                Math.min(
                                        1,
                                        elapsed /
                                        duration
                                )
                        );

                const y =
                        startY +
                        (
                                endY -
                                startY
                        ) *
                        progress;

                track.style.transform =
                        `translate3d(0, ${y}px, 0)`;

                if (
                        currentGame &&
                        currentGame.state ===
                        "PRESENTATION" &&
                        currentGame.presentationType ===
                        "INITIAL" &&
                        progress < 1
                ) {

                  initialAnimationFrame =
                          requestAnimationFrame(
                                  animate
                          );
                }
              }

              animate();
            }
    );
  }

  function startRoundPresentation(game) {

    const track =
            document.getElementById(
                    "presentationTrack"
            );

    const title =
            document.getElementById(
                    "presentationRound"
            );

    const roundIndex =
            Number(
                    game.currentRound ?? 0
            );

    const round =
            game.pack?.rounds?.[
                    roundIndex
                    ];

    if (!round) {

      finishPresentation();

      return;
    }

    const categories =
            round.categories || [];

    if (
            categories.length === 0
    ) {

      finishPresentation();

      return;
    }

    title.textContent =
            round.name ||
            `РАУНД ${roundIndex + 1}`;

    track.style.top = "50%";

    cancelAnimationFrame(
            roundAnimationFrame
    );

    track.innerHTML = "";

    function animateRound() {

      if (
              !currentGame ||
              currentGame.state !==
              "PRESENTATION" ||
              currentGame.presentationType !==
              "ROUND"
      ) {

        return;
      }

      const elapsed =
              Math.max(
                      0,
                      Date.now() -
                      Number(
                              game.presentationStartedAt
                      )
              );

      const topicDuration =
              2000;

      const index =
              Math.floor(
                      elapsed /
                      topicDuration
              );

      if (
              index >=
              categories.length
      ) {

        return;
      }

      const insideTopic =
              elapsed %
              topicDuration;

      const currentElement =
              track.firstElementChild;

      const currentIndex =
              Number(
                      track.dataset.index ??
                      "-1"
              );

      if (
              currentIndex !== index
      ) {

        track.innerHTML = "";

        track.dataset.index =
                String(index);

        const element =
                document.createElement(
                        "div"
                );

        element.className =
                "round-topic";

        element.textContent =
                categories[index].name;

        track.appendChild(
                element
        );

        void element.offsetWidth;

        animateTopic(
                element,
                insideTopic
        );
      }

      roundAnimationFrame =
              requestAnimationFrame(
                      animateRound
              );
    }

    track.dataset.index =
            "-1";

    animateRound();
  }

  function animateTopic(
          element,
          elapsed
  ) {

    const duration =
            2000;

    function frame() {

      if (
              !element.isConnected
      ) {

        return;
      }

      const currentElapsed =
              elapsed +
              (
                      performance.now() -
                      topicAnimationStart
              );

      const progress =
              Math.max(
                      0,
                      Math.min(
                              1,
                              currentElapsed /
                              duration
                      )
              );

      let y;
      let opacity;

      if (
              progress < .2
      ) {

        const p =
                progress / .2;

        y =
                120 -
                120 * p;

        opacity =
                p;

      } else if (
              progress < .75
      ) {

        y = 0;

        opacity = 1;

      } else {

        const p =
                (
                        progress -
                        .75
                ) / .25;

        y =
                -120 * p;

        opacity =
                1 - p;
      }

      element.style.transform =
              `translate3d(0, ${y}px, 0)`;

      element.style.opacity =
              opacity;

      if (
              progress < 1
      ) {

        requestAnimationFrame(
                frame
        );
      }
    }

    const topicAnimationStart =
            performance.now();

    frame();
  }

  function stopPresentation() {

    cancelAnimationFrame(
            initialAnimationFrame
    );

    initialAnimationFrame =
            null;

    cancelAnimationFrame(
            roundAnimationFrame
    );

    roundAnimationFrame =
            null;

    const track =
            document.getElementById(
                    "presentationTrack"
            );

    track.innerHTML = "";

    track.dataset.index =
            "-1";

    track.style.transform =
            "translate3d(0, 0, 0)";
  }

  function finishPresentation() {

    stopPresentation();

    presentationKey =
            null;

    document
            .getElementById(
                    "presentationScreen"
            )
            .classList.add(
            "hidden"
    );

    document
            .getElementById(
                    "gameScreen"
            )
            .classList.remove(
            "hidden"
    );

    if (
            currentGame
    ) {

      renderBoard(
              currentGame
      );
    }
  }

  function updateGame(game) {

    if (!game) {
      return;
    }

    currentGame =
            game;

    if (
            game.state ===
            "PRESENTATION"
    ) {

      showPresentation(
              game
      );

      return;
    }

    if (
            game.state ===
            "ANSWER_REVEAL"
    ) {

      stopPresentation();

      document
              .getElementById(
                      "presentationScreen"
              )
              .classList.add(
              "hidden"
      );

      document
              .getElementById(
                      "gameScreen"
              )
              .classList.remove(
              "hidden"
      );

      hideQuestion();

      showAnswerReveal(
              game
      );

      return;
    }

    if (
            presentationKey !== null
    ) {

      stopPresentation();

      presentationKey = null;

      document
              .getElementById(
                      "presentationScreen"
              )
              .classList.add(
              "hidden"
      );

      document
              .getElementById(
                      "gameScreen"
              )
              .classList.remove(
              "hidden"
      );
    }

    if (
            game.state ===
            "LOBBY"
    ) {

      hideQuestion();

      hideAnswerReveal();

      renderLobby();

      renderPlayers(
              game
      );

      return;
    }

    if (
            game.state ===
            "BOARD"
    ) {

      hideQuestion();

      hideAnswerReveal();

      renderBoard(
              game
      );

      return;
    }

    if (
            game.state ===
            "QUESTION" ||
            game.state ===
            "ANSWERING"
    ) {

      hideAnswerReveal();

      renderBoard(
              game
      );

      showQuestion(
              game
      );

      return;
    }

    if (
            game.state ===
            "FINISHED"
    ) {

      hideQuestion();

      hideAnswerReveal();

      renderBoard(
              game
      );
    }
  }

  function renderLobby() {

    const board =
            document.getElementById(
                    "board"
            );

    board.innerHTML = "";

    board.style.gridTemplateColumns =
            "";

    const turnInfo =
            document.getElementById(
                    "turnInfo"
            );

    turnInfo.textContent =
            "Ожидание игры...";
  }

  function renderBoard(game) {

    const board =
            document.getElementById(
                    "board"
            );

    board.innerHTML = "";

    const categories =
            game.categories || [];

    if (
            categories.length === 0
    ) {

      return;
    }

    board.style.gridTemplateColumns =
            `repeat(${categories.length}, 1fr)`;

    categories.forEach(
            category => {

              const column =
                      document.createElement(
                              "div"
                      );

              column.className =
                      "category";

              const title =
                      document.createElement(
                              "div"
                      );

              title.className =
                      "category-name";

              title.textContent =
                      category.name;

              column.appendChild(
                      title
              );

              (
                      category.questions ||
                      []
              ).forEach(
                      question => {

                        const cell =
                                document.createElement(
                                        "div"
                                );

                        cell.className =
                                "question-cell";

                        if (
                                question.used
                        ) {

                          cell.classList.add(
                                  "used"
                          );

                        } else {

                          cell.textContent =
                                  question.price;
                        }

                        column.appendChild(
                                cell
                        );
                      }
              );

              board.appendChild(
                      column
              );
            }
    );

    renderTurn(
            game
    );

    renderPlayers(
            game
    );
  }

  function renderTurn(game) {

    const turnInfo =
            document.getElementById(
                    "turnInfo"
            );

    if (
            !game.turnPlayer
    ) {

      turnInfo.textContent =
              "Ход ещё не определён";

      return;
    }

    turnInfo.textContent =
            `Ходит: ${
                    game.turnPlayer.name
            }`;
  }

  function renderPlayers(game) {

    const players =
            document.getElementById(
                    "players"
            );

    players.innerHTML = "";

    (
            game.players ||
            []
    ).forEach(
            player => {

              const card =
                      document.createElement(
                              "div"
                      );

              card.className =
                      "player-card";

              if (
                      game.turnPlayer &&
                      game.turnPlayer.id ===
                      player.id
              ) {

                card.classList.add(
                        "active"
                );
              }

              card.innerHTML = `
                <div class="player-name">
                    ${escapeHtml(player.name)}
                </div>

                <div class="player-score">
                    ${player.score}
                </div>
            `;

              players.appendChild(
                      card
              );
            }
    );
  }

  function resolveAssetUrl(content) {

    if (
            /^https?:\/\//i.test(
                    content
            )
    ) {
      return content;
    }

    return `/api/pack/assets?path=${encodeURIComponent(content)}`;
  }

  function renderContent(
          container,
          content,
          imageClass
  ) {

    container.innerHTML = "";

    if (!content) {
      container.textContent = "—";
      return;
    }

    const type =
            content.type ||
            "text";

    const value =
            content.content ??
            content.text ??
            "";

    if (
            type === "image"
    ) {

      const image =
              document.createElement(
                      "img"
              );

      image.src =
              resolveAssetUrl(
                      value
              );

      image.alt =
              "Изображение";

      image.className =
              imageClass ||
              "question-image";

      image.onerror = () => {

        container.textContent =
                "Не удалось загрузить изображение";
      };

      container.appendChild(
              image
      );

      return;
    }

    container.textContent =
            value;
  }

  function showQuestion(game) {

    const question =
            game.currentQuestion;

    if (!question) {
      return;
    }

    document
            .getElementById(
                    "questionScreen"
            )
            .style.display =
            "flex";

    document
            .getElementById(
                    "questionPrice"
            )
            .textContent =
            question.price;

    renderContent(
            document.getElementById("questionText"),
            question.question || {
              type: question.type || "text",
              content: question.content ?? question.text ?? ""
            },
            "question-image"
    );

    const status =
            document.getElementById(
                    "answeringStatus"
            );

    if (
            game.state ===
            "QUESTION"
    ) {

      status.textContent =
              "Ведущий показывает вопрос";

      hideTimer();

      return;
    }

    if (
            game.state ===
            "ANSWERING"
    ) {

      status.textContent =
              game.buzzedPlayer
                      ? `${game.buzzedPlayer.name} отвечает`
                      : "ЖМИТЕ КНОПКУ!";

      showTimer(
              game
      );
    }
  }

  function hideQuestion() {

    hideTimer();

    document
            .getElementById(
                    "questionScreen"
            )
            .style.display =
            "none";
  }

  function showTimer(game) {

    clearInterval(
            timerInterval
    );

    document
            .getElementById(
                    "answerTimer"
            )
            .style.display =
            "block";

    updateTimer(
            game
    );

    timerInterval =
            setInterval(
                    () => {

                      if (
                              !currentGame ||
                              currentGame.state !==
                              "ANSWERING"
                      ) {

                        hideTimer();

                        return;
                      }

                      updateTimer(
                              currentGame
                      );

                    },
                    50
            );
  }

  function updateTimer(game) {

    let remaining = 0;

    if (
            game.answeringDeadline &&
            game.answeringDeadline > 0
    ) {

      remaining =
              Math.max(
                      0,
                      game.answeringDeadline -
                      Date.now()
              );

    } else {

      remaining =
              game.answeringRemainingMillis ||
              0;
    }

    const percentage =
            Math.max(
                    0,
                    Math.min(
                            100,
                            remaining /
                            15000 *
                            100
                    )
            );

    document
            .getElementById(
                    "answerTimerFill"
            )
            .style.width =
            `${percentage}%`;
  }

  function hideTimer() {

    clearInterval(
            timerInterval
    );

    timerInterval =
            null;

    document
            .getElementById(
                    "answerTimer"
            )
            .style.display =
            "none";

    document
            .getElementById(
                    "answerTimerFill"
            )
            .style.width =
            "0%";
  }

  function showAnswerReveal(game) {

    const question =
            game.currentQuestion;

    if (!question) {
      return;
    }

    renderContent(
            document.getElementById("answerRevealText"),
            question.answer,
            "answer-image"
    );

    document
            .getElementById(
                    "answerRevealScreen"
            )
            .style.display =
            "flex";

    clearTimeout(
            answerRevealTimer
    );

    answerRevealTimer =
            setTimeout(
                    hideAnswerReveal,
                    5000
            );
  }

  function hideAnswerReveal() {

    clearTimeout(
            answerRevealTimer
    );

    answerRevealTimer =
            null;

    document
            .getElementById(
                    "answerRevealScreen"
            )
            .style.display =
            "none";
  }

  function escapeHtml(value) {

    return String(value)

            .replaceAll(
                    "&",
                    "&amp;"
            )

            .replaceAll(
                    "<",
                    "&lt;"
            )

            .replaceAll(
                    ">",
                    "&gt;"
            )

            .replaceAll(
                    '"',
                    "&quot;"
            )

            .replaceAll(
                    "'",
                    "&#039;"
            );
  }

  async function loadGame() {

    try {

      const response =
              await fetch(
                      "/api/game",
                      {
                        cache:
                                "no-store"
                      }
              );

      if (!response.ok) {
        return;
      }

      updateGame(
              await response.json()
      );

    } catch (e) {

      console.error(
              "TV load error:",
              e
      );
    }
  }

  const socket =
          new StompJs.Client({

            brokerURL:
                    `${
                            location.protocol ===
                            "https:"
                                    ? "wss"
                                    : "ws"
                    }://${window.location.host}/ws`,

            reconnectDelay:
                    2000,

            heartbeatIncoming:
                    10000,

            heartbeatOutgoing:
                    10000,

            onConnect: () => {

              console.log(
                      "TV WebSocket connected"
              );

              socket.subscribe(
                      "/topic/host",
                      message => {

                        try {

                          const event =
                                  JSON.parse(
                                          message.body
                                  );

                          if (
                                  event.game
                          ) {

                            updateGame(
                                    event.game
                            );
                          }

                        } catch (e) {

                          console.error(
                                  "TV WS error:",
                                  e
                          );
                        }
                      }
              );

              loadGame();
            },

            onDisconnect: () => {

              console.log(
                      "TV WebSocket disconnected"
              );
            },

            onWebSocketClose: () => {

              console.log(
                      "TV WebSocket closed"
              );
            },

            onWebSocketError: e => {

              console.error(
                      "TV WebSocket error:",
                      e
              );
            },

            onStompError: frame => {

              console.error(
                      "TV STOMP error:",
                      frame
              );
            }
          });

  socket.activate();

  setInterval(
          loadGame,
          1000
  );

  loadGame();

</script>

</body>

</html>
